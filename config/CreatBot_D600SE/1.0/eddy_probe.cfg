# eddy probe config for D600SE

########################################
# Eddy Probe
########################################

[probe_eddy_ng sw_eddy]
sensor_type: ldc1612
intb_pin:detect:PA10
i2c_mcu: detect
i2c_software_scl_pin: detect:PA9
i2c_software_sda_pin: detect:PA8
x_offset:26.5
y_offset:27.7
tap_target_z: -0.25
tap_threshold: 150.0
tap_butter_lowcut: 4.0
tap_butter_highcut: 30.0
temp_stable_tolerance: 0.5
temp_stable_interval: 30
temp_stable_timeout: 300
max_errors: 3

[temperature_probe _sw_eddy]
sensor_type: Generic 3950
sensor_pin: detect:PA0
horizontal_move_z: 2

