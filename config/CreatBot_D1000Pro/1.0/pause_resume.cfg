# pause_resume configuration for D1000Pro

########################################
# CANCEL_PRINT/PAUSE/RESUME/
########################################

[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos   : True
variable_custom_park_x    : 500.0
variable_custom_park_y    : 350.0
variable_custom_park_dz   : 20.0
variable_retract          : 2.0
variable_cancel_retract   : 10.0
variable_speed_retract    : 60.0
variable_unretract: 20.0
variable_speed_unretract  : 6.0
# quick-pause: variable_unretract is now equal to variable_retract (it was 20.0).
# PAUSE retracts variable_retract, RESUME restores exactly that amount, and the
# extra priming is done explicitly by variable_pause_prime (see _PAUSE_PRIME_WIPE).
# quick-pause settings -------------------------------------------------------
# pause_temp : cool both melt chambers down to this target while paused (below the
#              flow point of ABS/PLA) so the nozzle stops drooling.  The original
#              print temperatures were already recorded by _USER_PAUSE, so RESUME
#              restores them.  Slow reheating on resume is accepted by design.
# pause_prime: extra filament (mm) pushed at the park position right before the
#              motion resumes, to refill the melt chamber emptied while paused.
# pause_wipe : distance (mm) of the short wipe along the cleaner edge that clears
#              the priming tail; 0 disables the wipe.
# park_at_cleaner: park on the [nozzle_cleaner] tray (off the part) instead of the
#              bed centre; set to False to fall back to custom_park_x/y + park_dz.
variable_pause_temp       : 190.0
variable_pause_prime      : 2.0
# pause_retract: how far the park retracts.  Two-sided trade-off, measured
# 2026-10-20: too small (3 mm) and the charged chamber drips through the pause
# AND the ~25 s reheat, so the head arrives at the part carrying a blob that
# ploughs the first lines; too large (10 mm) and the melt zone is emptied, so the
# refill has to be perfect or the first lines are starved.  6 mm keeps the drip
# small while the refill stays short.  The factory CLEAN_NOZZLE retracts 10 mm
# (clean_retract) before scrubbing, so 6 is not aggressive.
variable_pause_retract    : 12.0
# pause_retract_speed: mm/s.  A 10 mm retract at 60 mm/s also notches the
# filament, which then under-delivers when it is pushed back.
variable_pause_retract_speed : 40.0
# pause_resume_extra: extra filament (mm) pushed at the park position on RESUME,
# right after the normal unretract, followed by a wipe.  The retract is really
# executed now (10 mm), and the unretract pushes the same 10 mm back into a melt
# chamber that spent the pause below the flow point - the extruder can slip on
# that first push, which shows up as under-extrusion when the print resumes.
# This is the knob to compensate that: 0 disables it.  Net filament added per
# pause = pause_prime + pause_resume_extra.
# pause_resume_extra: extra mm pushed at the park, on top of the unretract.
# Keep this SMALL: whatever over-pressure it leaves in the chamber oozes out
# during the ~6 s travel back to the part and arrives as a blob on the tip
# (measured 2026-10-20).  The material that actually matters is the part prime.
variable_pause_resume_extra       : 0.0
variable_pause_resume_extra_speed : 5.0
# pause_purge_*: on resume, extrude a line on the bed edge (while MOVING) instead
# of piling a stationary prime on the tip.  This flushes the cold plug out of the
# melt zone and fills the nozzle in the geometry the machine prints in.
variable_pause_purge_enable : False
variable_pause_purge_x1     : 30.0
variable_pause_purge_y      : 20.0
variable_pause_purge_len    : 170.0
variable_pause_purge_z      : 0.3
variable_pause_purge_speed  : 55.0
variable_pause_purge_h      : 0.3
variable_pause_purge_w      : 0.8
# pause_purge_wipe: wipe the tip on the pad right after the purge line, so a
# hanging bead cannot travel back to the part.
variable_pause_purge_wipe   : False
# pause_purge_passes / pause_purge_flow: the purge line goes OUT AND BACK, and the
# E per pass is over-extruded by pause_purge_flow, so the first pass is not
# under-filled (the bead used to appear only at the very end of the line).
variable_pause_purge_passes : 2
variable_pause_purge_flow   : 1.25
# pause_soak_s: soak at print temperature BEFORE the first push on resume.  The
# pause leaves a solid plug above the melt zone; pushing it back right after
# M109 is the highest-torque moment and makes the extruder gear slip (that is
# what starves the first lines).  Runs instead of a dwell after the push.
variable_pause_soak_s             : 3.0
# pause_dwell_s: dwell (s) at the park after the unretract, before travelling
# back.  Gives the pushed-back plug time to melt/settle.  0 disables it.
variable_pause_dwell_s            : 1.0
# pause_resume_part_prime: extra filament (mm) pushed AFTER the move back to the
# part, i.e. the last thing before the print restarts.  It runs inside
# SAVE/RESTORE_GCODE_STATE so the gcode feedrate is not clobbered.  A too large
# value leaves a lump right at the resume point.
variable_pause_resume_part_prime  : 1.5
variable_pause_resume_part_speed  : 6.0
# pause_travel_retract: filament (mm) retracted at the park right before the head
# travels back to the part, and pushed back (with pause_resume_part_prime on top)
# after the move.  This is what keeps the chamber from oozing a blob onto the tip
# during that ~6 s travel; 0 disables it.
# pause_heat_settle_s / pause_hot_retract_e: after the resume reheat the melt
# expands; wait at the park (off the part) so that expansion drips away, then
# pull it back.  The flush includes this retract so the balance stays closed.
# pause_return_retract_e / pause_descent_retract_e: keep pulling filament back
# WHILE travelling back and WHILE descending, instead of one retract before it.
# pause_desc_refill_e: part of the make-up delivered DURING the last descent
# leg, so the chamber is not left starved when the first line starts.
variable_pause_desc_refill_e     : 14.0
variable_pause_return_retract_e  : 0.0
variable_pause_descent_retract_e : 0.0
variable_pause_heat_settle_s     : 5.0
variable_pause_hot_retract_e     : 5.0
# pause_corner_makeup_e: make-up amount pushed at the park BEFORE returning.
# 0 = none (default 2026-11-09).  Set it back to ~20 together with
# pause_resume_settle_s if a full first line matters more than a dry return.
# pause_arrive_settle_s: stand still this long at the resume point before the
# file continues, so the make-up pressure reaches the nozzle and the first
# line is not empty.
# resume_toast_s: how often the "resume in progress" toast is repeated
# while the recovery runs (0 = show it only once).
# resume_toast_lang: text of the "resume in progress" toast.
#   both (default) = 中英双语, zh = 仅中文, en = English only.
#   (Chosen by this knob because Klipper cannot read the UI language.)
variable_resume_toast_lang      : "both"
variable_resume_toast_s         : 8.0
variable_pause_arrive_settle_s  : 2.0
variable_pause_corner_makeup_e  : 0.0
variable_pause_travel_retract     : 0.0
# pause_clean_* : scraping the ooze bead off the nozzle on resume.  The bead
# solidifies during the pause and sits over the orifice, which starves the first
# seconds of the resumed print, so it is scraped at the wiper's contact height
# (pause_clean_z / pause_wipe_z default to [nozzle_cleaner] clean_z_height).
variable_pause_clean_sweeps : 2
variable_pause_clean_rows   : 4
variable_pause_clean_sweep  : 0
variable_pause_clean_speed  : 0
variable_pause_clean_z      : None
variable_pause_wipe_z       : None

# --- quick-pause actions, ported from the old Marlin implementation -------
# pause_lift / pause_lift_init: Z is raised by these amounts relative to the
# frozen layer height and NEVER lowered while paused (Marlin: 10 / 1 mm).
variable_pause_lift          : 20.0
variable_pause_lift_init     : 3.0
# pause_retract_init: the first small retract, done together with the first lift
# (Marlin: 2 mm); the rest of pause_retract follows with the full lift.
variable_pause_retract_init  : 2.0
# pause_lift_retract: extra retract spread over the Z lift, so the
# thread is pulled in while the nozzle rises (Z is only 7 mm/s).
variable_pause_lift_retract  : 3.0

# pause_snap_mm / pause_snap_speed: after the retract, a fast horizontal move
# toward the park breaks the thread (Z can only do 7 mm/s, so a vertical-only
# rise would just draw it out).
variable_pause_snap_mm       : 12.0
variable_pause_snap_speed    : 300.0
# pause_snap_lift: lift this much BEFORE the horizontal snap, so the torn end
# is not dragged across the part.
variable_pause_snap_lift     : 0.0
# pause_flick_spit_e / _speed: spit this much wet filament right BEFORE the
# whip, so a short solidified thread becomes a flingable bead again.
# pause_flick_bulge_e / _speed: extra material pushed slowly just before the
# whip so a tiny residue becomes one flingable bead.  Deliberately NOT
# compensated in the flush; the whip/travel retracts take it back, so the
# chamber stays negative for the return trip.
variable_pause_flick_bulge_e   : 0.0
# pause_flick_dwell_s: wait after the spit/bulge, before the whip - the melt
# keeps flowing for a few seconds after the push, so let it finish at the park
# (off the part) and settle into one bead.
variable_pause_flick_dwell_s   : 0.0
variable_pause_flick_bulge_speed: 2.0
variable_pause_flick_spit_e     : 0.0
variable_pause_flick_spit_speed : 8.0
# pause_snap_e: the snap move also retracts this much, so the torn
# thread is pulled back in instead of being carried away.
variable_pause_snap_e        : 4.0
# pause_move_speed: the XY park / travel-back speed (Marlin: 70 mm/s).
variable_pause_move_speed    : 70.0
# pause_close_z / pause_close_e / pause_close_speed: the final approach onto the
# frozen point - stop close_z above it, unretract all but close_e, then sink the
# last close_e at close_speed (Marlin: 0.1 mm / 1 mm / 1 mm/s).
variable_pause_close_z       : 0.1
variable_pause_close_e       : 0.2
variable_pause_close_speed   : 1.0
# pause_cooldown: the old product does NOT cool the hotend when pausing, and that
# is what lets the exact-E re-entry work without cleaning/priming.  Set True to
# get the drool-limiting cooldown back (then the clean/purge path is needed).
variable_pause_cooldown      : True
# pause_cool_delta / pause_cool_min: PM spec 2026-11-03 - cool to
# (print temperature - delta), never below min.
variable_pause_cool_delta     : 20.0
variable_pause_cool_min       : 180.0

# pause_resume_extra_e / pause_extra_per_min: the make-up prime at the end of the
# resume (at the frozen Z, no Z movement).  A hot parked nozzle keeps oozing, so
# the amount grows with the pause: extra = pause_resume_extra_e + hold_s/60 *
# pause_extra_per_min.  Set pause_resume_extra_e to 0 to restore Marlin's plain
# "exact E only" behaviour.
variable_pause_resume_extra_e : 0.0
variable_pause_extra_per_min  : 1.0

# pause_extra_max: hard cap (mm) for the hold-scaled make-up prime - a pause of an
# hour (or a day) must not turn into a huge blob.
variable_pause_extra_max      : 12.0

# pause_spit_e / pause_spit_speed: before travelling back, push this much filament
# out at the park (the blob hanging from the tip drops there, on the bed edge),
# then retract the same amount again.  Net E change is zero, so the re-entry and
# the make-up prime below are unaffected - and Z never moves.
variable_pause_spit_e        : 6.0
variable_pause_spit_speed    : 12.0

# pause_spit_z: the spit is done with the nozzle this close to the bed, so the
# blob is left behind on the bed edge instead of hanging from the tip.  The park
# is far from the model, so lowering Z here is safe.
variable_pause_spit_z        : 0.5

# pause_resume_flush_s / pause_resume_flush_rate: at the resume the melt chamber is
# refilled BEFORE travelling back - flush_s seconds of extrusion at flush_rate
# (mm/s of filament).  RULE: flush_s * flush_rate MUST BE LARGER than
# pause_retract, otherwise the filament only refills the void left by the retract
# and never reaches the nozzle - the resume then starts dry (measured 2026-10-21:
# 8 mm flush against a 14 mm retract produced no material at all).
# 1.5 s * 12 mm/s = 18 mm against 14 mm => ~4 mm really comes out, at the park.
variable_pause_resume_flush_s    : 1.5
variable_pause_resume_flush_rate : 2.5

# pause_resume_drain_mm_per_s / pause_resume_drain_max: while parked the nozzle keeps
# oozing, so the resume must push back pause_retract PLUS the drained amount
# (drain = hold_s * rate, capped).  0.08 mm/s = 4.8 mm/min.
variable_pause_resume_drain_mm_per_s : 0.10
variable_pause_resume_drain_max      : 8.0
# pause_descent_e: extra filament pushed WHILE Z descends onto the part, so the
# nozzle is already pressurised when it lands (Marlin restores during the descent
# too).  This is added on top of the travel retract.
variable_pause_descent_e             : 0.5

# pause_boost_pct / pause_boost_s: after the resume, run M221 S(100+pct) for this
# many seconds, so the last bit of make-up is spread along the first lines.
variable_pause_boost_pct      : 0.0
variable_pause_boost_s        : 3.0

# pause_point_prime_e: small static prime at the resume point (break the void).
# pause_boost_slow / _pct / _s: for this many seconds the print runs at _slow %
# speed while over-extruding by _pct %, so the rest of the make-up is laid along
# the real print path instead of being squirted at one spot.
variable_pause_point_prime_e  : 4.0
variable_pause_boost_slow     : 20.0

# pause_slow_s / pause_boost_slow: phase A - for this many seconds the print runs
# at this percentage of its normal speed (while over-extruding), so the make-up is
# laid along the real print path.  Phase B then runs at normal speed with the same
# over-extrusion for pause_boost_s seconds.
# pause_first_s / pause_first_slow: the very first make-up stage runs at this
# speed (percent) for this long, before the 20 % slow stage.  A slower stage
# lowers the demand so the chamber can refill while the first line is laid.
# ---- manager spec 2026-11-03: bed lowering --------------------------------
# pause_bed_drop_mm        : bed drop when pausing (Z increases = bed moves away)
# bed_drop_min_space_mm    : if less travel than this is left, do not move at all
# end_bed_drop_mm          : drop at the end of a tall print
# end_bed_drop_half        : for short prints drop half the print height instead
# end_bed_clearance_mm     : minimum nozzle-to-bed distance after the end drop
# end_park_x / end_park_y  : where the nozzle parks when the print finishes
variable_pause_bed_drop_mm      : 50.0
variable_bed_drop_min_space_mm  : 50.0
variable_bed_drop_speed         : 10.0
variable_end_bed_drop_mm        : 50.0
variable_end_bed_drop_half      : True
variable_end_bed_clearance_mm   : 50.0
variable_end_park_x             : 45.0
variable_end_z0                 : 0.0
variable_end_park_y             : 20.0
variable_pause_first_s         : 4.0
variable_pause_first_slow      : 10.0
variable_pause_slow_s         : 9.0

# pause_mid_slow / pause_mid_s: stepped ramp - after the slow phase the print runs
# at this percentage for this long before returning to 100%.
variable_pause_mid_slow        : 50.0

# pause_slow_pct / pause_mid_pct: extrude factor (percent added) for the slow and
# mid stages of the ramp.  The slow stage needs more because the chamber is still
# filling there; the mid stage needs less because it is already full.
variable_pause_slow_pct        : 150.0
variable_pause_mid_pct         : 0.0
variable_pause_mid_s           : 3.0
# long-pause grading: hold longer than pause_long_s switches the make-up to
# the *_long_* durations (durations only, percentages unchanged).
variable_pause_long_s          : 300.0
variable_pause_long_slow_s     : 20.0
variable_pause_long_mid_s      : 6.0

# pause_descent_z: only the LAST this-many mm of the descent carry the make-up.
# The total amount is unchanged (it is what fills the chamber); shortening this
# shortens the redundant bead line proportionally (20 -> 6 mm).
variable_pause_descent_z             : 6.0

# pause_descent_speed: the make-up is pushed in at this speed (mm/s).  A fast
# refill traps the air drawn in by the retracts; slow lets it escape upwards.
variable_pause_descent_speed         : 5.0

# pause_whip_x / pause_whip_speed: the blob that oozes while parked cannot be
# removed by extruding (it is still molten and just grows).  A fast short XY
# reversal at the park flings it off by inertia - no Z movement involved.
variable_pause_whip_x        : 25.0
variable_pause_whip_speed    : 800.0

# pause_park_x / pause_park_y: absolute park (and flick) position - a front corner
# keeps the ooze and the flick far away from the model.  None = bed edge.
variable_pause_park_x        : 45.0
variable_pause_park_y        : 20.0
# pause_whip_passes / _accel: zig-zag flick, several short passes with the
# velocity limit opened for the duration of the flick.
variable_pause_whip_passes   : 0
variable_pause_whip_accel    : 8000.0

# pause_resume_suck_e / _speed: after the whip, retract slowly and deeply so the
# thread/bead that is still attached to the tip is pulled back into the nozzle
# instead of being dragged onto the part.
variable_pause_resume_suck_e    : 0.0
variable_pause_resume_suck_speed : 2.5
# pause_hold_s is published by klippy (virtual_sdcard) when the user resumes.
variable_pause_hold_s         : 0.0
# pause_wipe_rows: how many rows of the cleaner pad the hot wipe sweeps across
# (the pad spans [nozzle_cleaner] clean_y_min..clean_y_max; one row can miss the
# scraping edge entirely).
variable_pause_wipe_rows    : 2
# pause_wipe_before_travel: wipe once more as the very last step at the park,
# after the travel retract has sealed the chamber, so the head travels back with
# a clean tip instead of carrying an ooze blob to the part.
variable_pause_wipe_before_travel : True
variable_pause_wipe       : 5.0
variable_pause_wipe_speed : 3000
variable_pause_park_z     : 3.5
# pause_park_y_offset: how far towards +Y the pause parks, measured from
# [nozzle_cleaner] clean_y_max.  The rest position must NOT be on the wiper pad
# (a long pause glues the nozzle to it and leaves the ooze nowhere to go): 30 mm
# puts it on the bed just inside the front edge.  The pad is still used, but only
# by _PAUSE_CLEAN / _PAUSE_PRIME_WIPE while they actually clean.
variable_pause_park_y_offset : 30.0
# ---- power-loss recovery (PLR) ---------------------------------------------
# plr_prelift: mm the head is lifted (and parked away from the part) BEFORE the
#              resume file heats anything.  The generated file declares its Z as
#              "recorded Z + plr_prelift", so plr.sh receives the same value from
#              _RESUME_INTERRUPTED - keep them in sync via this variable.
# plr_wipe_passes / plr_wipe_suck_e: the ooze bead formed while parked hot is
#              flicked off (with a retract spread over the passes) before the
#              head travels back to the part.
# plr_prime_e / plr_prime_speed: tiny prime at the resume point, just enough to
#              break the meniscus.  The chamber itself is refilled at the park
#              corner (plr_loss_retract @ plr_refill_speed); a large stationary
#              prime here is what left a blob on the resume point (2026-10-27).
# plr_loss_retract: only the fallback default.  The outage retract itself writes
#              plr_loss_done and _PLR_RESUME_MOVE uses that value.
variable_plr_prelift        : 10.0
variable_plr_wipe_passes    : 10
variable_plr_wipe_suck_e    : 6.0
# plr_slow_s: slow-stage duration used by the PLR ramp only (the pause-resume
# path uses pause_slow_s).  1 s shorter than pause_slow_s to avoid the slight
# accumulation at the end of the PLR slow stage (reported 2026-10-28).
# plr_slow_pct: slow-stage flow used by the PLR ramp only (the pause path uses
# pause_slow_pct).  Kept at 150 so the PLR tail does not accumulate.
# plr_soak_s: at the PLR resume, soak this long at temperature BEFORE the
# wipe, so the cold solidified smear on the nozzle softens first.
# plr_flick_spit_e / _speed / plr_flick_dwell_s: before the PLR whip, push this
# much hot filament out slowly (so it floods the tip face and fuses with the
# cold smear), then wait this long with no motion so the heat soaks in.
variable_plr_flick_spit_e   : 4.0
variable_plr_flick_spit_speed: 3.0
variable_plr_flick_dwell_s  : 2.0
# plr_purge_e / _speed: the manual "Purge 10 mm" button in the PLR clean-up
# prompt.  plr_purge_temp is only a fallback when the print temperature was not
# recoverable (the button heats the nozzle first with M109).
variable_plr_purge_e        : 10.0
variable_plr_purge_speed    : 3.0
variable_plr_purge_temp     : 245.0
# plr_quick_pause: False = the ORIGINAL vendor power-loss flow (plr_orig.sh,
# direct SDCARD_PRINT_FILE).  True = the quick-pause PLR (park, heat, purge
# prompt, _PLR_RESUME_MOVE + ramp).  Default: original.
variable_plr_quick_pause    : False
variable_plr_soak_s         : 20.0
variable_plr_first_s        : 4.0
variable_plr_first_slow     : 10.0
variable_plr_slow_pct       : 150.0
variable_plr_slow_s         : 8.0
variable_plr_prime_e        : 1.0
variable_plr_prime_speed    : 4.0
variable_plr_loss_retract   : 16.0
# plr_hop: the Z hop the outage handler performs before the escape move.  It
#              shifts the physical height that _PLR_PARK later re-declares as
#              Z=0, so plr.sh adds it to the Z declaration.  Must match HOP= in
#              Moonraker's [button power_outage].
variable_plr_hop            : 0.5
# plr_refill_speed: speed used to push the outage-retract amount back at the
#              park corner before travelling to the part.
variable_plr_refill_speed   : 6.0
variable_park_lift_fast   : 1.5
variable_park_fast        : 4000
variable_park_fast_xy     : 8000
variable_park_at_cleaner  : True
variable_speed_hop        : 5.0
variable_speed_move       : 100.0
variable_park_at_cancel   : False
variable_park_at_cancel_x : None
variable_park_at_cancel_y : None
variable_use_fw_retract   : False
variable_idle_timeout     : 600
variable_runout_sensor    : ""
variable_filament_sensor  : "filament_switch_sensor extruder"
variable_filament_sensor1 : "filament_switch_sensor extruder1"
variable_user_temp_macro  : "_USER_TEMP_RESUME"
variable_user_pause_macro : "_USER_PAUSE"
variable_user_resume_macro: ""
variable_user_cancel_macro: "_USER_CANCEL"
gcode:
 # Nothing

[gcode_macro _USER_PAUSE]
gcode:
    {% set heaters = [('extruder', 'last_extruder_temp'),
                        ('extruder1', 'last_extruder1_temp'),
                        ('heater_bed', 'last_bed_temp')] %}
    {% set act = printer.gcode_move.gcode_position %}
    ##### quick-pause: the frozen Z is only stored in MEMORY here.       #####
    ##### SAVE_VARIABLE rewrites/fsyncs config_variables.cfg (~20 ms,     #####
    ##### occasionally much longer on eMMC) and that latency must not sit  #####
    ##### between the freeze and the retreat - it caused a "Timer too     #####
    ##### close" shutdown on 2026-10-20.  _USER_PAUSE_SAVE_Z, which runs   #####
    ##### after the park, puts it on disk.                                #####
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=power_resume_z VALUE={act.z}
    ##### quick-pause (Marlin scheme): remember the exact frozen pose in #####
    ##### memory.  The resume walks back to it in three steps (travel at   #####
    ##### the raised Z, 0.1 mm clearance, exact at 1 mm/s) instead of      #####
    ##### cleaning/purging/priming, so Z never comes down while paused.    #####
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=resume_x VALUE={act.x}
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=resume_y VALUE={act.y}
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=resume_z VALUE={act.z}
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=resume_e VALUE={act.e}
    {% for heater, name in heaters %}
        {% set temp = printer[heater].target if heater in printer else 0 %}
        {% set restore = False if printer[heater] == ''
                else True if params.RESTORE|default(1)|int == 1 else False %}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE={name} VALUE="{{'restore': restore, 'temp': temp}}"
    {% endfor %}
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=resume_extruder VALUE="'{printer.toolhead.extruder}'"

[gcode_macro _USER_PAUSE_SAVE_Z]
description: quick-pause: persist the frozen Z, clear the parked Z, schedule the real one
gcode:
    ##### quick-pause: NO disk I/O in _USER_PAUSE any more.            #####
    ##### _set_quick_pause() has just re-anchored print_time to        #####
    ##### "mcu now + pause_anchor_ms", so a slow SAVE_VARIABLE (eMMC      #####
    ##### fsync, 20 ms to several hundred) between the freeze and the    #####
    ##### first park move eats that margin and the MCU answers          #####
    ##### "Timer too close" -> shutdown (happened 2026-10-20 13:xx).     #####
    ##### Writing them here is safe: the park's ~7.7 s of motion is      #####
    ##### already queued, so a host stall costs nothing.                #####
    ##### power_resume_z = frozen gcode Z (in memory since _USER_PAUSE), #####
    ##### power_park_z = 0 until _PAUSE_PARK_DONE records the real one   #####
    ##### 10 s later (the park has to have really arrived first).        #####
    SAVE_VARIABLE VARIABLE=power_resume_z VALUE={printer['gcode_macro RESUME'].power_resume_z}
    SAVE_VARIABLE VARIABLE=power_park_z VALUE=0
    UPDATE_DELAYED_GCODE ID=_PAUSE_PARK_DONE DURATION=10

[delayed_gcode _PAUSE_PARK_DONE]
initial_duration: 3600
gcode:
    SAVE_VARIABLE VARIABLE=power_park_z VALUE={printer['gcode_macro RESUME'].park_z}

[gcode_macro _USER_PAUSE_COOLDOWN]
description: quick-pause: optional cooldown (off by default, see pause_cooldown)
gcode:
    ##### quick-pause (Marlin scheme): the old product keeps the hotend at the #####
    ##### printing temperature while paused.  That is what makes the exact-E     #####
    ##### re-entry work: the melt stays ready, so no cleaning / purging /       #####
    ##### priming is needed, and no Z movement is required either.              #####
    ##### Cooling stays available as an opt-in (pause_cooldown: True).           #####
    {% set client = printer['gcode_macro _CLIENT_VARIABLE']|default({}) %}
    {% if client.pause_cooldown|default(false)|lower == 'true' %}
        ##### PM spec 2026-11-03: cool to (print temperature - 20), never below #####
        ##### 180 C.  The printing temperature of each heater is the one recorded #####
        ##### when the pause happened.                                            #####
        {% set r = printer['gcode_macro RESUME'] %}
        {% set floor = client.pause_cool_min|default(180.0)|float %}
        {% set delta = client.pause_cool_delta|default(20.0)|float|abs %}
        {% for idx in range(2) %}
            {% set heater = "extruder" if idx == 0 else "extruder1" %}
            {% if heater in printer %}
                {% set print_temp = r.last_extruder_temp.temp|default(0)|float if idx == 0
                                    else r.last_extruder1_temp.temp|default(0)|float %}
                {% set target = (print_temp - delta) if print_temp > 100 else client.pause_temp|default(190.0)|float %}
                {% if target < floor %}{% set target = floor %}{% endif %}
                {% if printer[heater].target|float > target %}
                    M104 T{idx} S{target}
                {% endif %}
            {% endif %}
        {% endfor %}
    {% endif %}

[gcode_macro _RESUME_EXTRUDER]
gcode:
    {% set client = printer['gcode_macro RESUME']|default({}) %}
    {% set autoshift_on = params.AUTOSHIFT|default(False)|lower %}
    {% set toolchange = client.change_runout|lower|default("") %}
    {% set extruder_filament = client.filament_state.extruder %}
    {% set extruder1_filament = client.filament_state.extruder1 %}
    {% set resume_extruder = client.resume_extruder|default("extruder") %}

    {% if autoshift_on == 'true' %}
        {% if extruder_filament and extruder1_filament %}
            {% if toolchange == "t0" %}
                {% set resume_extruder = "extruder" %}
            {% elif toolchange == "t1" %}
                {% set resume_extruder = "extruder1" %}
            {% endif %}
        {% else %}
            {% if extruder_filament %}
                {% set resume_extruder = "extruder" %}
            {% elif extruder1_filament %}
                {% set resume_extruder = "extruder1" %}
            {% endif %}
        {% endif %}
    {% endif %}
    {% if printer.toolhead.extruder != resume_extruder %}
        T{0 if resume_extruder|default("extruder") == "extruder" else 1 }
    {% endif %}
    _FILAMENT_UPDATE

[gcode_macro _EXTRUDER_TEMPERATURE_HANDLE]
gcode:
    {% set client = printer['gcode_macro RESUME']|default({}) %}
    {% set last_extruder_temp = client.last_extruder_temp %}
    {% set last_extruder1_temp = client.last_extruder1_temp %}
    {% set resume_extruder = client.resume_extruder|lower %}
    {% if resume_extruder != printer.toolhead.extruder %}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=last_extruder_temp VALUE="{last_extruder1_temp}"
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=last_extruder1_temp VALUE="{last_extruder_temp}"
    {% endif %}

[gcode_macro _USER_TEMP_RESUME]
gcode:
    {% set extruder_info = [
        {'index': 0, 'name': 'last_extruder_temp'},
        {'index': 1, 'name': 'last_extruder1_temp'}] %}
    {% set value = printer["gcode_macro RESUME"]["last_bed_temp"].temp %}
    {% if value != 0 %}
      M190 S{value}
    {% endif %}
    {% set temperature = "last_extruder_temp" if printer.toolhead.extruder == "extruder" else "last_extruder1_temp" %}
    {% set value = printer["gcode_macro RESUME"][temperature].temp %}
    {% if printer[printer.toolhead.extruder].temperature < value-3 %}
        ##### 2026-11-11: the "resume in progress" toast already shows the nozzle #####
        ##### temperature, and a second toast here would only replace it.       #####
        ##### (kept as a comment so the original information is not lost)       #####
        ##### RESPOND ... "Restoring <side> extruder temperature, this may take #####
    {% endif %}
    {% for info in extruder_info %}
        {% set variable = printer["gcode_macro RESUME"][info.name] %}
        {% if variable.restore %}
            M104 T{ info.index } S{ variable.temp }
        {% endif %}
    {% endfor %}
    {% for info in extruder_info %}
        {% set variable = printer["gcode_macro RESUME"][info.name] %}
        {% if variable.restore %}
            {% set tool = "extruder" if info.index == 0 else "extruder1" %}
            {% set needwait = True if printer[tool].temperature < variable.temp else False %}
            {% if needwait %}
                M109 T{info.index} S{variable.temp}
                {% endif %}
        {% endif %}
    {% endfor %}

[gcode_macro _USER_CANCEL]
gcode:
    {% if 'z' in printer.toolhead.homed_axes %}
        G91
        G1 Z30 F600 ; lift nozzle
    {% endif %}
    M84

[gcode_macro _REAPPLY_OFFSET]
gcode:
    {% set re_extruder = printer['gcode_macro RESUME'].resume_extruder|default("extruder") %}
    {% set svv = printer.save_variables.variables %}
    {% set x_offset = svv.nozzle_x_offset_val|default(0)|float %}
    {% set y_offset = svv.nozzle_y_offset_val|default(0)|float %}
    {% set z_offset = svv.nozzle_z_offset_val|default(0)|float %}
    {% set x_offset = x_offset - 53 %}
    {% set is_extruder = printer.toolhead.extruder == "extruder" %}

    {% if printer.toolhead.extruder!= re_extruder %}
        SET_GCODE_OFFSET Z={0 if is_extruder else z_offset} MOVE=1
        SET_GCODE_OFFSET Y={0 if is_extruder else y_offset}
        SET_GCODE_OFFSET X={0 if is_extruder else x_offset}
    {% endif %}

[gcode_macro RESUME]
description: Resume the actual running print
rename_existing: RESUME_BASE
variable_last_extruder_temp: {'restore': False, 'temp': 0}
variable_last_extruder1_temp: {'restore': False, 'temp': 0}
variable_last_bed_temp: {'restore': False, 'temp': 0}
variable_restore_idle_timeout: 0
variable_idle_state: False
variable_filament_state: ""
variable_change_runout: ""
variable_resume_extruder: ""
variable_power_resume_z: 0.0
variable_park_z: 0.0
variable_resume_x: 0.0
variable_resume_y: 0.0
variable_resume_z: 0.0
variable_resume_e: 0.0
variable_pause_hold_s: 0.0
variable_resuming: False
gcode:
    ##### get user parameters or use default #####
    {% set autoshift = printer.save_variables.variables.auto_change_nozzle|default(False) %}
    {% set client = printer['gcode_macro _CLIENT_VARIABLE']|default({}) %}
    {% set do_resume = False %}
    {% set runout = True %}
    {% macro resume_action() %}
        ##### 2026-11-10: silent duplicate-click guard.  A second RESUME queued #####
        ##### behind the first runs when is_paused is already false; without this #####
        ##### it would drive the retreat + descent a second time.                #####
        {% if not printer.pause_resume.is_paused|default(false) %}
            ##### silently ignore: the click was queued behind the running resume #####
            ##### and arrives when the printer is already printing again.          #####
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=change_runout VALUE="'ignored'"
        {% else %}
        SET_GCODE_VARIABLE MACRO=_PAUSE_PRIME_WIPE VARIABLE=dbg_entry VALUE={printer['gcode_macro _PAUSE_PRIME_WIPE'].dbg_entry + 1}
        ##### 2026-11-11 (PM): no overlay.  A toast is shown the moment the resume   #####
        ##### is accepted and repeated until the printer is actually unpaused,  #####
        ##### so the user always sees "resume in progress, do not operate".     #####
                ##### 2026-11-11: no temperature in the text (the toast is shown with #####
        ##### a delay, so a live reading misleads), and the repeat is driven  #####
        ##### by a reactor timer in klippy - g-code based repeats cannot run  #####
        ##### while the blocking M109 holds the queue.                        #####
        {% set _c = printer['gcode_macro _CLIENT_VARIABLE']|default({}) %}
        {% set _iv = _c.resume_toast_s|default(8.0)|float|abs %}
        {% set _lang = _c.resume_toast_lang|default('both')|string|lower %}
        {% if _lang == 'zh' %}
            {% set _msg = "恢复打印中，请稍后" %}
        {% elif _lang == 'en' %}
            {% set _msg = "Resuming print, please wait." %}
        {% else %}
            {% set _msg = "恢复打印中，请稍后 / Resuming print, please wait." %}
        {% endif %}
        {% if _iv > 0 %}
            START_RESUME_TOAST MSG="{_msg}" INTERVAL={_iv}
        {% else %}
            RESPOND TYPE=echo MSG="{_msg}"
        {% endif %}
        _FILAMENT_UPDATE
        _RESUME_EXTRUDER AUTOSHIFT={autoshift}
        ##### quick-pause: scrape the solidified ooze off the nozzle FIRST, #####
        ##### while it is still cold (the pause cooled the hotend).  Doing it #####
        ##### before the reheat is what actually removes the bead; the hot wipe #####
        ##### further down only spreads what is left.                         #####
        _EXTRUDER_TEMPERATURE_HANDLE
        ##### the melt expands as it is reheated, and that expansion arrives    #####
        ##### AFTER M109 returns - it is what oozed during the return travel    #####
        ##### and the Z descent.  Let it drip at the park (off the part) first,  #####
        ##### then pull it back.                                                #####
        {% set _settle = client.pause_heat_settle_s|default(5.0)|float|abs %}
        {% if _settle > 0 %}
            G4 P{(_settle * 1000)|int}
        {% endif %}
        {% set _hot_ret = client.pause_hot_retract_e|default(5.0)|float|abs %}
        {% if _hot_ret > 0 and printer.toolhead.extruder != ''
              and printer[printer.toolhead.extruder].can_extrude %}
            _CLIENT_EXTRUDE LENGTH=-{_hot_ret} SPEED={client.pause_retract_speed|default(40.0)|float|abs}
        {% endif %}

        {% set can_extrude = True if printer.toolhead.extruder == ''           # no extruder defined in config
                        else printer[printer.toolhead.extruder].can_extrude %} # status of active extruder
        #### Printer comming from timeout idle state ####
        {% if printer.idle_timeout.state|upper == "IDLE" or idle_state or autoshift %}
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=idle_state VALUE=False
        {% endif %}
        {% if last_extruder_temp.restore or last_extruder1_temp.restore %}
            { client.user_temp_macro|default("") }
            {% set do_resume = True %}
        {% elif can_extrude %}
            {% set do_resume = True %}
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_PAUSE_PRIME_WIPE VARIABLE=dbg_doresume VALUE="'{do_resume}'"
        ##### quick-pause: SOAK at temperature BEFORE the first push.  The pause #####
        ##### left a solidified plug in/above the melt zone; M109 only proves the #####
        ##### heater block is at temperature, and pushing into that plug is what    #####
        ##### makes the extruder gear slip (reported 2026-10-20: "就是打滑").       #####
        ##### The old pause_dwell_s waited AFTER the push, which is the wrong way   #####
        ##### round - by then the slip has already happened.                       #####
        {% if do_resume %}
            _PAUSE_RESUME_MOVE
        {% endif %}
        _ACT_RESUME DO_RESUME={ do_resume }
        {% endif %}
    {% endmacro %}
    {% if printer['gcode_button _door_detection'] %}
        {% set sv = printer.save_variables.variables %}
        {% set door_function = sv.door_detect|default("Disabled") %}
        {% set door_state = printer['gcode_button _door_detection'].state|default('released')|lower %}

        {% if door_function == 'Pause Print' and door_state == 'released' %}
            RESPOND TYPE=command MSG="action:prompt_begin"
            RESPOND TYPE=command MSG="action:prompt_text Please close the door and click Resume to proceed."
            RESPOND TYPE=command MSG="action:prompt_footer_button Ok|RESPOND TYPE=command MSG=action:prompt_end"
            RESPOND TYPE=command MSG="action:prompt_show"
        {% else %}
            { resume_action() }
        {% endif %}
    {% else %}
        { resume_action() }
    {% endif %}

[gcode_macro _PAUSE_SOAK]
description: quick-pause: let the melt zone reach temperature before pushing anything
gcode:
    ##### quick-pause: M109 reports the heater BLOCK; the filament that the pause #####
    ##### pulled up into the cold zone is still solid.  Pushing it back immediately #####
    ##### is the highest-torque moment of the whole pause cycle and is where the      #####
    ##### extruder gear slips, which starves the first lines.  Soaking first costs a  #####
    ##### few seconds and removes that torque peak.                                  #####
    {% set client = printer['gcode_macro _CLIENT_VARIABLE']|default({}) %}
    {% set soak = client.pause_soak_s|default(0.0)|float %}
    {% if soak > 0 %}
        G4 P{(soak * 1000)|int}
        SET_GCODE_VARIABLE MACRO=_PAUSE_PRIME_WIPE VARIABLE=dbg_soak VALUE={soak}
    {% endif %}

[gcode_macro _PAUSE_CLEAN]
description: quick-pause: scrape the solidified ooze off the nozzle at the contact height
gcode:
    ##### quick-pause: the wipe used to run at pause_park_z (3.5 mm) while the #####
    ##### wiper's contact height is [nozzle_cleaner] clean_z_height (2.5 mm), so #####
    ##### it wiped air and the bead from the pause stayed on the nozzle - and a  #####
    ##### bead over the orifice is also what starves the first seconds of the    #####
    ##### resumed print.  This dives to the contact height and scrapes.          #####
    ##### Runs BEFORE the reheat: the cooled bead is brittle and scrapes off,    #####
    ##### while a hot wipe would only smear it.                                 #####
    {% set client = printer['gcode_macro _CLIENT_VARIABLE']|default({}) %}
    {% set nc = printer.configfile.settings.nozzle_cleaner|default({}) %}
    {% set at_cleaner = client.park_at_cleaner|default(true)|lower == 'true'
                        and nc.get('clean_x_min') is not none
                        and nc.get('clean_x_max') is not none %}
    {% if at_cleaner and printer.pause_resume.is_paused and "xyz" in printer.toolhead.homed_axes %}
        {% set sweeps = client.pause_clean_sweeps|default(3)|int %}
        {% set z_park = client.pause_park_z|default(3.5)|float %}
        ##### quick-pause: None / 0 must fall back to the cleaner's configured #####
        ##### contact height.  Jinja's |default does NOT replace None, and      #####
        ##### None|float is 0.0 - that bug made this macro dive to Z=0 (2.5 mm  #####
        ##### into the wiper!) on 2026-10-20.                                   #####
        {% set z_clean_opt = client.get('pause_clean_z') %}
        {% if z_clean_opt is none or z_clean_opt|float <= 0.2 %}
            {% set z_clean = nc.get('clean_z_height', 2.5)|float %}
        {% else %}
            {% set z_clean = z_clean_opt|float %}
        {% endif %}
        {% set x_min = nc.get('clean_x_min', 250.0)|float %}
        {% set x_max = nc.get('clean_x_max', 295.0)|float %}
        {% set y_min = nc.get('clean_y_min', -28.0)|float %}
        {% set y_max = nc.get('clean_y_max', -18.0)|float %}
        {% set sp = client.pause_clean_speed|default(0)|float %}
        {% if sp <= 0 %}
            {% set sp = nc.get('clean_speed', 4000)|float %}
        {% endif %}
        {% set sweep = client.pause_clean_sweep|default(0)|float %}
        {% if sweep <= 0 %}
            {% set sweep = x_max - x_min %}
        {% endif %}
        {% set x_c = (x_min + x_max) / 2.0 %}
        {% set x_a = [[x_c - sweep / 2.0, x_min]|max, x_max]|min %}
        {% set x_b = [[x_c + sweep / 2.0, x_min]|max, x_max]|min %}
        ##### quick-pause: cover the WHOLE pad, not one line.  The pad spans #####
        ##### clean_y_min..clean_y_max (-28..-18 on this machine); sweeping a  #####
        ##### single row at y=-18 can miss the scraping edge entirely, which   #####
        ##### is why the blob survived the wipe on 2026-10-20.  The factory   #####
        ##### CLEAN_NOZZLE does a 2-D zig-zag over the same area.             #####
        {% set rows = client.pause_clean_rows|default(3)|int %}
        {% set was_abs = printer.gcode_move.absolute_coordinates %}
        G90
        ##### travel at the park height and line up over the pad first, so this #####
        ##### can never drag across the part, whatever the park was             #####
        G1 Z{z_park} F{sp}
        G1 X{x_a} Y{y_max} F{sp}
        {% if z_clean < z_park %}
            G1 Z{z_clean} F{sp}
        {% endif %}
        {% for r in range(rows) %}
            {% set yy = y_max - (y_max - y_min)
                        * (r / ((rows - 1) if rows > 1 else 1)) %}
            {% for _ in range(sweeps) %}
                G1 X{x_b} Y{yy} F{sp}
                G1 X{x_a} Y{yy} F{sp}
            {% endfor %}
        {% endfor %}
        {% if z_clean < z_park %}
            G1 Z{z_park} F{sp}
        {% endif %}
        G1 X{x_a} Y{y_max} F{sp}
        {% if not was_abs %} G91 {% endif %}
        SET_GCODE_VARIABLE MACRO=_PAUSE_PRIME_WIPE VARIABLE=dbg_clean VALUE={rows * sweeps}
        SET_GCODE_VARIABLE MACRO=_PAUSE_PRIME_WIPE VARIABLE=dbg_clean_z VALUE={z_clean}
    {% endif %}

[gcode_macro _PAUSE_PRIME_WIPE]
description: quick-pause: prime and wipe at the park position before the motion resumes
variable_dbg_entry: 0
variable_dbg_outer: 0
variable_dbg_arm_prime: 0
variable_dbg_arm_wipe: 0
variable_dbg_prime: 0
variable_dbg_wipe: 0
variable_dbg_cur: 0
variable_dbg_wait: 0
variable_dbg_cans: 0
variable_dbg_doresume: ""
variable_dbg_clean: 0
variable_dbg_soak: 0
variable_dbg_purge: 0
variable_dbg_clean_z: 0
gcode:
  ##### diagnostics: query with printer.objects.query?gcode_macro _PAUSE_PRIME_WIPE #####
  SET_GCODE_VARIABLE MACRO=_PAUSE_PRIME_WIPE VARIABLE=dbg_entry VALUE={printer['gcode_macro _PAUSE_PRIME_WIPE'].dbg_entry + 1}
  {% set client = printer['gcode_macro _CLIENT_VARIABLE']|default({}) %}
  ##### PRIME= / WIPE= let the resume path re-wipe without priming again #####
  {% set prime  = params.PRIME|default(client.pause_prime|default(0.0))|float %}
  {% set wipe   = params.WIPE|default(client.pause_wipe|default(0.0))|float %}
  {% set nc     = printer.configfile.settings.nozzle_cleaner|default({}) %}
  {% set at_cleaner = client.park_at_cleaner|default(true)|lower == 'true'
                      and nc.get('clean_x_min') is not none
                      and nc.get('clean_x_max') is not none %}
  {% set nc_x_min = nc.get('clean_x_min', 250.0)|float %}
  {% set nc_x_max = nc.get('clean_x_max', 295.0)|float %}
  {% set nc_y_max = nc.get('clean_y_max', -18.0)|float %}
  {% set x_park = ((nc_x_min + nc_x_max) / 2.0) if at_cleaner
             else client.custom_park_x|default(0.0)|float %}
  {% set y_park = nc_y_max if at_cleaner else client.custom_park_y|default(0.0)|float %}
  ##### quick-pause: clamp park + wipe target to the axis soft limits #####
  {% set ax_x_min = printer.configfile.settings.stepper_x.position_min|float %}
  {% set ax_x_max = printer.configfile.settings.stepper_x.position_max|float %}
  {% set ax_y_min = printer.configfile.settings.stepper_y.position_min|float %}
  {% set ax_y_max = printer.configfile.settings.stepper_y.position_max|float %}
  {% set x_park = [[x_park, ax_x_min]|max, ax_x_max]|min %}
  {% set y_park = [[y_park, ax_y_min]|max, ax_y_max]|min %}
  {% set x_wipe = [[x_park + wipe, ax_x_min]|max, ax_x_max]|min %}
  {% set wsp    = client.pause_wipe_speed|default(3000)|float %}
  SET_GCODE_VARIABLE MACRO=_PAUSE_PRIME_WIPE VARIABLE=dbg_prime VALUE={prime}
  SET_GCODE_VARIABLE MACRO=_PAUSE_PRIME_WIPE VARIABLE=dbg_wipe VALUE={wipe}
  ##### quick-pause: do NOT gate on can_extrude here (it can still read False #####
  ##### right after the M109 restore) - wait for the temperature explicitly and #####
  ##### let _CLIENT_EXTRUDE do its own hot-enough check.                        #####
  {% set cur_temp = printer[printer.toolhead.extruder].temperature
                    if printer.toolhead.extruder != '' else 0 %}
  {% set wait_temp = printer['gcode_macro RESUME'].last_extruder_temp.temp
                     if printer.toolhead.extruder == 'extruder'
                     else printer['gcode_macro RESUME'].last_extruder1_temp.temp %}
  SET_GCODE_VARIABLE MACRO=_PAUSE_PRIME_WIPE VARIABLE=dbg_cur VALUE={cur_temp}
  SET_GCODE_VARIABLE MACRO=_PAUSE_PRIME_WIPE VARIABLE=dbg_wait VALUE={wait_temp}
  SET_GCODE_VARIABLE MACRO=_PAUSE_PRIME_WIPE VARIABLE=dbg_cans VALUE={1 if printer.toolhead.extruder != '' and printer[printer.toolhead.extruder].can_extrude else 0}
  {% if printer.toolhead.extruder != ''
        and (prime > 0 or wipe > 0) %}
    SET_GCODE_VARIABLE MACRO=_PAUSE_PRIME_WIPE VARIABLE=dbg_outer VALUE=1
    {% if prime > 0 %}
        SET_GCODE_VARIABLE MACRO=_PAUSE_PRIME_WIPE VARIABLE=dbg_arm_prime VALUE=1
        M83
        G1 E{prime} F300
    {% endif %}
    ##### factory style wipe: sweep along the wiper at the contact height #####
    ##### uses _CLIENT_LINEAR_MOVE (vendor helper, ABSOLUTE=1 -> G90) #####
    ##### NOTE: do NOT call _CLIENT_LINEAR_MOVE with positional params here: #####
    ##### this klipper rejects 'X277.5 ...' as "Malformed command" and the      #####
    ##### resulting error aborts RESUME.  Plain G1 is what the park macro uses  #####
    ##### (and it is proven to work), so use that and restore the coord mode.   #####
    {% if wipe > 0 %}
        SET_GCODE_VARIABLE MACRO=_PAUSE_PRIME_WIPE VARIABLE=dbg_arm_wipe VALUE=1
        {% set was_abs = printer.gcode_move.absolute_coordinates %}
        ##### quick-pause: the wipe has to touch the wiper.  pause_park_z is the #####
        ##### resting height (3.5); the blade's contact height is [nozzle_cleaner] #####
        ##### clean_z_height (2.5), so dive for the sweep and come back up.        #####
        {% set z_park_w = client.pause_park_z|default(3.5)|float %}
        ##### quick-pause: None / 0 -> the contact height (see _PAUSE_CLEAN) #####
        {% set z_wipe_opt = client.get('pause_wipe_z') %}
        {% if z_wipe_opt is none or z_wipe_opt|float <= 0.2 %}
            {% set z_wipe = nc.get('clean_z_height', 2.5)|float %}
        {% else %}
            {% set z_wipe = z_wipe_opt|float %}
        {% endif %}
        G90
        ##### quick-pause: lift and line up over the pad BEFORE diving.  The #####
        ##### head now rests on the bed edge (pause_park_y_offset), so diving   #####
        ##### first and moving sideways afterwards would drag the nozzle across  #####
        ##### the bed at the contact height.                                    #####
        {% set y_lo = nc.get('clean_y_min', -28.0)|float %}
        {% set rows_w = client.pause_wipe_rows|default(2)|int %}
        {% if z_wipe < z_park_w %}
            G1 Z{z_park_w} F{wsp}
        {% endif %}
        G1 X{x_park} Y{y_park} F{wsp}
        {% if z_wipe < z_park_w %}
            G1 Z{z_wipe} F{wsp}
        {% endif %}
        {% for r in range(rows_w) %}
            {% set yy = y_park - (y_park - y_lo)
                        * (r / ((rows_w - 1) if rows_w > 1 else 1)) %}
            G1 X{x_wipe} Y{yy} F{wsp}
            G1 X{x_park} Y{yy} F{wsp}
        {% endfor %}
        G1 X{x_park} Y{y_park} F{wsp}
        {% if z_wipe < z_park_w %}
            G1 Z{z_park_w} F{wsp}
        {% endif %}
        {% if not was_abs %} G91 {% endif %}
    {% endif %}
  {% else %}
    SET_GCODE_VARIABLE MACRO=_PAUSE_PRIME_WIPE VARIABLE=dbg_outer VALUE=-1
  {% endif %}

[gcode_macro _PAUSE_PURGE]
description: quick-pause: purge back and forth on a line at the bed edge, then seal
gcode:
    ##### quick-pause: the fix for a starved restart is to extrude WHILE MOVING. #####
    ##### A stationary prime only builds a blob on the tip; a purge line at the     #####
    ##### bed edge flushes the cold plug out of the melt zone, fills the nozzle    #####
    ##### and leaves the chamber at the right pressure.                            #####
    ##### The line goes OUT AND BACK (pause_purge_passes) with an over-extruded     #####
    ##### flow (pause_purge_flow), because one under-filled pass showed the bead    #####
    ##### only at the very end of the line (2026-10-20).                           #####
    {% set client = printer['gcode_macro _CLIENT_VARIABLE']|default({}) %}
    {% if client.pause_purge_enable|default(true)|lower == 'true'
          and "xyz" in printer.toolhead.homed_axes %}
        {% set x1 = client.pause_purge_x1|default(30.0)|float %}
        {% set y1 = client.pause_purge_y|default(20.0)|float %}
        {% set ln = client.pause_purge_len|default(170.0)|float %}
        {% set zp = client.pause_purge_z|default(0.3)|float %}
        {% set sp = client.pause_purge_speed|default(55.0)|float %}
        {% set ph = client.pause_purge_h|default(0.3)|float %}
        {% set pw = client.pause_purge_w|default(0.8)|float %}
        {% set passes = client.pause_purge_passes|default(2)|int %}
        {% set flow = client.pause_purge_flow|default(1.25)|float %}
        {% set zs = client.pause_park_z|default(3.5)|float %}
        {% set seal = client.pause_travel_retract|default(0.0)|float %}
        {% set sp_ret = client.pause_retract_speed|default(10.0)|float|abs %}
        {% set ax_x_max = printer.configfile.settings.stepper_x.position_max|float %}
        {% set ln = [[ln, ax_x_max - x1 - 5.0]|min, 10.0]|max %}
        {% set pe = (ln * ph * pw * flow / 2.405)|round(3) %}
        {% set was_abs = printer.gcode_move.absolute_coordinates %}
        G90
        G1 Z{zs} F3000
        G1 X{x1} Y{y1} F6000
        G1 Z{zp} F3000
        M83
        {% for p in range(passes) %}
            {% set x_to = (x1 + ln) if p % 2 == 0 else x1 %}
            G1 X{x_to} Y{y1} E{pe} F{(sp * 60)|int}
        {% endfor %}
        G1 Z{zs} F3000
        {% if seal > 0 %}
            _CLIENT_EXTRUDE LENGTH=-{seal} SPEED={sp_ret}
        {% endif %}
        {% if not was_abs %} G91 {% endif %}
        {% if client.pause_purge_wipe|default(true)|lower == 'true' %}
            _PAUSE_PRIME_WIPE PRIME=0
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_PAUSE_PRIME_WIPE VARIABLE=dbg_purge VALUE={pe * passes}
    {% endif %}

[gcode_macro _PAUSE_RESUME_MOVE]
description: quick-pause: slow refill, whip, suck the bead back in, no Z descent
gcode:
    ##### quick-pause: the last two symptoms (bead on the part + thin first     #####
    ##### lines) are the same thing: the bead left on the tip is dragged over    #####
    ##### the part and scrapes the fresh extrusion away.  Countermeasures:       #####
    #####  * flush SLOWLY so the filament melts into the tip instead of hanging  #####
    #####  * whip, then a slow deep retract that sucks the thread back in         #####
    #####  * only travel after that, with a travel retract                        #####
    ##### Z is never lowered.                                                    #####
    {% set client = printer['gcode_macro _CLIENT_VARIABLE']|default({}) %}
    {% set r = printer['gcode_macro RESUME'] %}
    ##### undo the pause bed drop BEFORE we descend anywhere #####
    _BED_DROP_RESTORE
    {% if r.resume_x is not none and "xyz" in printer.toolhead.homed_axes %}
        {% set x_r = r.resume_x|float %}
        {% set y_r = r.resume_y|float %}
        {% set z_r = r.resume_z|float %}
        {% set cz = client.pause_close_z|default(0.1)|float|abs %}
        {% set ce = client.pause_close_e|default(0.2)|float|abs %}
        {% set ret = params.RETRACT|default(client.pause_retract|default(12.0))|float|abs %}
        {% set sp_move = client.pause_move_speed|default(70.0)|float|abs %}
        {% set sp_close = client.pause_close_speed|default(1.0)|float|abs %}
        {% set sp_retract = client.pause_retract_speed|default(10.0)|float|abs %}
        {% set flush_rate = client.pause_resume_flush_rate|default(2.5)|float|abs %}
        {% set trav_ret = client.pause_travel_retract|default(4.0)|float|abs %}
        {% set suck = client.pause_resume_suck_e|default(6.0)|float %}
        {% set desc_e = client.pause_descent_e|default(1.5)|float|abs %}
        {% set hold = r.pause_hold_s|default(0.0)|float %}
        {% set drain_rate = client.pause_resume_drain_mm_per_s|default(0.10)|float %}
        {% set drain_max = client.pause_resume_drain_max|default(8.0)|float %}
        {% set drain = hold * drain_rate %}
        {% if drain > drain_max %}{% set drain = drain_max %}{% endif %}
        {% set lift_ret = client.pause_lift_retract|default(3.0)|float|abs %}
        {% set snap_e = client.pause_snap_e|default(4.0)|float|abs %}
        {% set flick_spit = client.pause_flick_spit_e|default(1.5)|float|abs %}
        ##### 2026-10-30: the flush must ALSO cover what the resume path pulls #####
        ##### back after it (whip suck + travel retract) and may subtract what   #####
        ##### the point pushes (flick spit + point prime + close).  Without the   #####
        ##### pull terms it was 8.8 mm short every single resume, which is why   #####
        ##### the first line was empty and the ramp then overshot 1-2 lines.     #####
        {% set point_e = client.pause_point_prime_e|default(0.0)|float %}
        ##### 2026-11-04: include the post-reheat retract (hot_ret) so the     #####
        ##### balance stays closed; also the drain model was retuned for the     #####
        ##### cooled pause.                                                     #####
        {% set hot_ret = client.pause_hot_retract_e|default(5.0)|float|abs %}
        ##### 2026-11-04: the flush refills ONLY what the PAUSE pulled out (plus #####
        ##### the small drain).  It must NOT compensate the travel-side retracts: #####
        ##### filling the chamber before them left it +28 mm over-pressured for   #####
        ##### the whole return and descent, which is what kept oozing.  The part  #####
        ##### they pull is given back while descending (pause_desc_refill_e) and  #####
        ##### by the slow-stage ramp.                                            #####
        ##### 2026-11-09: NOTHING is extruded at the corner any more.  The corner #####
        ##### push pressurised the chamber, and that pressure bleeds off over the  #####
        ##### following seconds - which is exactly the return + descent, so the    #####
        ##### material was carried onto the part.  The make-up is delivered after  #####
        ##### returning instead (descent refill + point prime).                   #####
        {% set corner_makeup = client.pause_corner_makeup_e|default(0.0)|float|abs %}
        {% set flush = corner_makeup %}
        {% if flush < 0 %}{% set flush = 0 %}{% endif %}
        {% set suck_speed = client.pause_resume_suck_speed|default(2.5)|float|abs %}
        {% set can_e = printer.toolhead.extruder != ''
                       and printer[printer.toolhead.extruder].can_extrude %}
        {% set abs_e = printer.gcode_move.absolute_extrude %}
        G90
        {% if can_e and flush > 0.001 %}
            ##### 1) optional corner refill (off by default since 2026-11-09) #####
            _CLIENT_EXTRUDE LENGTH={flush} SPEED={flush_rate}
        {% endif %}
            ##### 1b) SPIT a little WET material before the whip.  A short       #####
            #####     solidified thread is stiff and cannot be flung off; wetting  #####
            #####     the tip first turns it back into a flingable bead.  The      #####
            #####     amount is taken off the corner flush so the total balances.  #####
            {% set flick_spit = client.pause_flick_spit_e|default(1.5)|float|abs %}
            {% if flick_spit > 0 %}
                _CLIENT_EXTRUDE LENGTH={flick_spit} SPEED={client.pause_flick_spit_speed|default(8.0)|float|abs}
            {% endif %}
            ##### 2026-11-04: then bulge the tip slowly so a tiny residue becomes #####
            ##### one bead the whip can actually take.  Not compensated on purpose. #####
            {% set bulge = client.pause_flick_bulge_e|default(5.0)|float|abs %}
            {% if bulge > 0 %}
                _CLIENT_EXTRUDE LENGTH={bulge} SPEED={client.pause_flick_bulge_speed|default(2.0)|float|abs}
            {% endif %}
            ##### 2026-11-04: let the chamber pressure drain before the whip.  The #####
            ##### melt keeps flowing for seconds after the push, so without this the #####
            ##### whip runs into a still-streaming tip; with it the tip settles into #####
            ##### one hanging bead that can be flung off.                           #####
            {% set flick_dwell = client.pause_flick_dwell_s|default(6.0)|float|abs %}
            {% if flick_dwell > 0 %}
                G4 P{(flick_dwell * 1000)|int}
            {% endif %}
        ##### 2) FLICK + RETRACT IN ONE MOTION (ported from 2026-10-22).  The #####        #####    flick alone could not detach the bead while the melt was still #####
        #####    streaming, so each pass now carries its share of the retract:   #####
        #####    the thread is sucked in while it is being flung off.           #####
        {% set whip_x = client.pause_whip_x|default(25.0)|float %}
        {% set whip_n = client.pause_whip_passes|default(5)|int %}
        {% set whip_sp = client.pause_whip_speed|default(800.0)|float %}
        {% set x_here = printer.gcode_move.gcode_position.x|float %}
        {% set y_here = printer.gcode_move.gcode_position.y|float %}
        {% set per_pass = (suck / whip_n) if whip_n > 0 else 0.0 %}
        {% if can_e %}
            M83
            {% set v_old = printer.toolhead.max_velocity|float %}
            {% set a_old = printer.toolhead.max_accel|float %}
            {% set whip_accel = client.pause_whip_accel|default(8000.0)|float %}
            SET_VELOCITY_LIMIT VELOCITY={whip_sp} ACCEL={whip_accel}
            {% for i in range(whip_n) %}
                G1 X{x_here - whip_x if i % 2 == 0 else x_here + whip_x} Y{y_here} E-{per_pass} F{(whip_sp * 60)|int}
            {% endfor %}
            G1 X{x_here} F{(whip_sp * 60)|int}
            SET_VELOCITY_LIMIT VELOCITY={v_old} ACCEL={a_old}
            ##### 3) travel retract on top of that #####
            {% if trav_ret > 0 %}
                _CLIENT_EXTRUDE LENGTH=-{trav_ret} SPEED={sp_retract}
            {% endif %}
            {% if abs_e %} M82 {% endif %}
        {% else %}
            {% for i in range(whip_n) %}
                G1 X{x_here - whip_x if i % 2 == 0 else x_here + whip_x} Y{y_here} F{(whip_sp * 60)|int}
            {% endfor %}
            G1 X{x_here} F{(whip_sp * 60)|int}
        {% endif %}
        ##### 2026-11-04: retract WHILE travelling back.  A single retract before #####
        ##### the travel cannot hold a full chamber: the ooze came back during the #####
        ##### ~4 s return trip and then again during the Z descent.                #####
        {% set ret_ret = client.pause_return_retract_e|default(4.0)|float|abs %}
        {% if can_e and ret_ret > 0 %}
            M83
            G1 X{x_r} Y{y_r} E-{ret_ret} F{(sp_move * 60)|int}
            {% if abs_e %} M82 {% endif %}
        {% else %}
            G1 X{x_r} Y{y_r} F{(sp_move * 60)|int}
        {% endif %}
        ##### the make-up is delivered over the LAST desc_z mm of the descent, #####
        ##### not over the whole 20 mm: same total (so the chamber is equally     #####
        ##### full), but the redundant bead line is only desc_z long.             #####
        {% set desc_z = client.pause_descent_z|default(6.0)|float|abs %}
        {% if desc_z < cz + 0.2 %}{% set desc_z = cz + 0.2 %}{% endif %}
        {% set lift_now = client.pause_lift|default(20.0)|float|abs %}
        {% if desc_z > lift_now %}{% set desc_z = lift_now %}{% endif %}
        {% set desc_speed = client.pause_descent_speed|default(5.0)|float|abs %}
        ##### descend first; the fast leg keeps retracting (the chamber is still #####
        ##### full at this point and oozed during the descent), the slow landing  #####
        ##### legs stay dry.                                                     #####
        {% set desc_ret = client.pause_descent_retract_e|default(3.0)|float|abs %}
        {% if can_e and desc_ret > 0 %}
            M83
            G1 Z{z_r + desc_z} E-{desc_ret} F{(sp_move * 60)|int}
            {% if abs_e %} M82 {% endif %}
        {% else %}
            G1 Z{z_r + desc_z} F{(sp_move * 60)|int}
        {% endif %}
        ##### give back the material the travel pulled, spread over the landing #####
        ##### leg: a moving push instead of a stationary blob at the point.     #####
        {% set desc_refill = client.pause_desc_refill_e|default(8.0)|float|abs %}
        {% if can_e and desc_refill > 0 %}
            M83
            G1 Z{z_r + cz} E{desc_refill} F{(desc_speed * 60)|int}
            {% if abs_e %} M82 {% endif %}
        {% else %}
            G1 Z{z_r + cz} F{(sp_move * 60)|int}
        {% endif %}
        G1 Z{z_r} F{(sp_close * 60)|int}
        {% if can_e %}
            ##### only a SMALL prime here - just enough to break the void.  Standing #####
            ##### still and squirting the whole make-up here scorched the spot.      #####
            {% set point_e = client.pause_point_prime_e|default(0.0)|float %}
            M83
            {% if point_e > 0 %}
                _CLIENT_EXTRUDE LENGTH={point_e} SPEED={desc_speed}
            {% endif %}
            {% if ce > 0 %}
                _CLIENT_EXTRUDE LENGTH={ce} SPEED={sp_close}
            {% endif %}
            {% if abs_e %} M82 {% endif %}
            ##### 2026-11-09: stand still so the pushed melt actually reaches the #####
            ##### nozzle before the file's first move.  Without this the first    #####
            ##### line or two ran empty even though the make-up had been pushed.   #####
            {% set arrive_settle = client.pause_arrive_settle_s|default(1.0)|float|abs %}
            {% if arrive_settle > 0 %}
                G4 P{(arrive_settle * 1000)|int}
            {% endif %}
            ##### the rest is laid along the REAL print path: slow the print down #####
            ##### with M220 and over-extrude with M221, so the make-up is spread     #####
            ##### over the first seconds of the actual path and then both factors    #####
            ##### are restored.  No guessing of the print direction needed.         #####

        {% endif %}
    {% endif %}

[gcode_macro _ACT_RESUME]
gcode:
    ##### get user parameters or use default #####
    {% set client = printer['gcode_macro _CLIENT_VARIABLE']|default({}) %}
    {% set velocity = printer.configfile.settings.pause_resume.recover_velocity %}
    {% set auto_extruder = params.AUTO|default(False) %}
    {% set sp_move = client.speed_move|default(velocity) %}
    {% set do_resume = true if params.DO_RESUME|default(False)|lower == 'true' else false %}
    {% set filament_state = printer['gcode_macro RESUME'].filament_state.runout|default(False) %}
    {% set restore_idle_timeout = printer['gcode_macro RESUME'].restore_idle_timeout|default(0) %}
    {% set prompt_txt = [] %}
    {% if filament_state %}
        {% if do_resume or auto_extruder %}
            {% if restore_idle_timeout > 0 %} SET_IDLE_TIMEOUT TIMEOUT={restore_idle_timeout} {% endif %} # restore idle_timeout time
            {client.user_resume_macro|default("")}
            ##### quick-pause (Marlin scheme): _PAUSE_RESUME_MOVE already put the #####
            ##### toolhead back on the frozen point with the E exactly where it     #####
            ##### was.  Only the g-code state (feedrate + coordinate modes) is left; #####
            ##### its MOVE is a no-op by then.                                      #####
            RESUME_BASE VELOCITY={params.VELOCITY|default(sp_move)}
            ##### the printer is unpaused now -> stop the repeating toast #####
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=resuming VALUE=False
            STOP_RESUME_TOAST
            _REAPPLY_OFFSET
            ##### NOW (after RESUME_BASE's RESTORE_GCODE_STATE, which would have #####
            ##### overwritten speed_factor) start the post-resume phases:          #####
            #####   phase A: very slow movement along the real print path          #####
            #####   phase B: normal speed, extra extrusion for a few seconds       #####
            {% set client2 = printer['gcode_macro _CLIENT_VARIABLE']|default({}) %}
            {% set slow = client2.pause_boost_slow|default(20.0)|float %}
            {% set slow_s = client2.pause_slow_s|default(9.0)|float|abs %}
            ##### long-pause grading (2026-10-28): after a long wait the chamber #####
            ##### needs a much longer slow stage to refill, otherwise the first    #####
            ##### lines are thin/broken for a whole band (photo-confirmed).        #####
            {% set hold = printer['gcode_macro RESUME'].pause_hold_s|default(0.0)|float %}
            {% set long_s = client2.pause_long_s|default(300.0)|float %}
            {% set is_long = long_s > 0 and hold > long_s %}
            {% if is_long %}
                {% set slow_s = client2.pause_long_slow_s|default(20.0)|float|abs %}
            {% endif %}
            {% set bpct = client2.pause_boost_pct|default(100.0)|float %}
            {% set bsec = client2.pause_boost_s|default(3.0)|float|abs %}
            {% set mid = client2.pause_mid_slow|default(50.0)|float %}
            {% set mid_s = client2.pause_mid_s|default(3.0)|float|abs %}
            {% if is_long %}
                {% set mid_s = client2.pause_long_mid_s|default(6.0)|float|abs %}
            {% endif %}
            ##### each ramp stage gets its own extrude factor: the slow stage needs #####
            ##### more (the chamber is still filling), the mid stage less (it is    #####
            ##### already full).  bpct is the factor used at full speed.            #####
            {% set slow_pct = client2.pause_slow_pct|default(150.0)|float %}
            {% set mid_pct = client2.pause_mid_pct|default(50.0)|float %}
            {% if slow_pct != 0 %}
                M221 S{100 + slow_pct}
            {% elif bpct != 0 %}
                M221 S{100 + bpct}
            {% endif %}
            ##### stepped ramp: slow -> mid -> full.  In the slow phase the hotend #####
            ##### has flow headroom so the make-up actually goes in; jumping 20->100 #####
            ##### in one step leaves the first full-speed lines short.             #####
            ##### stage 0: a very slow 10 % phase first.  The make-up works by #####
            ##### lowering the DEMAND, so the chamber can refill while the first #####
            ##### (most critical) line is being laid.                            #####
            {% set first_s = client2.pause_first_s|default(4.0)|float|abs %}
            {% set first_slow = client2.pause_first_slow|default(10.0)|float %}
            {% set lead = 0.0 %}
            {% if first_s > 0 and first_slow > 0 and first_slow < 100 %}
                M220 S{first_slow}
                UPDATE_DELAYED_GCODE ID=_PAUSE_FIRST_OFF DURATION={first_s}
                {% set lead = first_s %}
            {% endif %}
            {% if slow_s > 0 and slow > 0 and slow < 100 %}
                M220 S{first_slow if lead > 0 else slow}
                UPDATE_DELAYED_GCODE ID=_PAUSE_SLOW_OFF DURATION={lead + slow_s}
            {% endif %}
            {% if mid_s > 0 and mid > 0 and mid < 100 %}
                UPDATE_DELAYED_GCODE ID=_PAUSE_MID_OFF DURATION={lead + slow_s + mid_s}
            {% endif %}
            {% if bpct != 0 and (slow_s + mid_s + bsec) > 0 %}
                SET_GCODE_VARIABLE MACRO=_PAUSE_BOOST VARIABLE=active VALUE=1
                UPDATE_DELAYED_GCODE ID=_PAUSE_BOOST_OFF DURATION={lead + slow_s + mid_s + bsec}
            {% endif %}
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=change_runout VALUE="None"
        {% else %}
            {% set msg = "Left" if printer.toolhead.extruder == "extruder" else "Right" %}
            {% set _d = prompt_txt.append("%s extruder not hot enough, will reheat and continue." % msg) %}
        {% endif %}
    {% else %}
        {% set msg = "Left" if printer.toolhead.extruder == "extruder" else "Right" %}
        {% set _d = prompt_txt.append("%s extruder detects no filament, please load filament and continue." % msg) %}
    {% endif %}
    ##### Generate User Information box in case of abort #####
    {% if not (filament_state and do_resume) %}
        ##### aborted: stop the repeating "resume in progress" toast #####
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=resuming VALUE=False
    STOP_RESUME_TOAST

        RESPOND TYPE=command MSG="action:prompt_begin RESUME ABORTED !"
        {% for element in prompt_txt %}
            RESPOND TYPE=command MSG='{"action:prompt_text %s" % element}'
        {% endfor %}
        RESPOND TYPE=command MSG="action:prompt_footer_button Ok|RESPOND TYPE=command MSG=action:prompt_end|info"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% endif %}

[gcode_macro _BED_DROP]
description: Lower the bed so that the TOTAL drop from FROM_Z is MM (not MM extra)
gcode:
    {% set client = printer['gcode_macro _CLIENT_VARIABLE']|default({}) %}
    {% set want = params.MM|default(0.0)|float|abs %}
    {% set min_space = client.bed_drop_min_space_mm|default(50.0)|float|abs %}
    {% set z_max = printer.toolhead.axis_maximum.z|float %}
    {% set z_now = printer.gcode_move.gcode_position.z|float %}
    ##### FROM_Z = the reference the total is measured from (defaults to now). #####
    ##### The pause retreat already lifts Z by ~23 mm, which already moves the #####
    ##### bed down that much - so the target must be FROM_Z + want, not         #####
    ##### z_now + want (that gave 73 mm total instead of 50).                   #####
    {% set from_z = params.FROM_Z|default(z_now)|float %}
    {% set target = from_z + want %}
    {% set delta = target - z_now %}
    {% set drop = 0.0 %}
    {% if want > 0.001 and delta > 0.001 and (z_max - z_now) >= min_space %}
        {% set limited = target if target < z_max else z_max %}
        {% set drop = limited - z_now %}
        G90
        G1 Z{limited} F{(client.bed_drop_speed|default(10.0)|float|abs) * 60}
    {% endif %}
    ##### remember the total so the resume can undo it #####
    {% set prev = printer.save_variables.variables.bed_drop_mm|default(0.0)|float|abs %}
    SAVE_VARIABLE VARIABLE=bed_drop_mm VALUE={(prev + drop)|round(4)}

[gcode_macro _BED_DROP_RESTORE]
description: Undo the bed drop recorded in bed_drop_mm (bed goes back up to Z - drop)
gcode:
    {% set client = printer['gcode_macro _CLIENT_VARIABLE']|default({}) %}
    {% set drop = printer.save_variables.variables.bed_drop_mm|default(0.0)|float|abs %}
    {% if drop > 0.001 %}
        {% set z_now = printer.gcode_move.gcode_position.z|float %}
        G90
        G1 Z{z_now - drop} F{(client.bed_drop_speed|default(10.0)|float|abs) * 60}
        SAVE_VARIABLE VARIABLE=bed_drop_mm VALUE=0
    {% endif %}

[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
gcode:
  ##### cancelled mid-resume: stop the repeating toast #####
  SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=resuming VALUE=False
  STOP_RESUME_TOAST
  ##### get user parameters or use default #####
  {% set client = printer['gcode_macro _CLIENT_VARIABLE']|default({}) %}
  {% set allow_park = client.park_at_cancel|default(false)|lower == 'true' %}
  {% set retract = client.cancel_retract|default(5.0)|abs %}
  ##### define park position #####
  {% set park_x = "" if (client.park_at_cancel_x|default(none) is none)
            else "X=" ~ client.park_at_cancel_x %}
  {% set park_y = "" if (client.park_at_cancel_y|default(none) is none)
            else "Y=" ~ client.park_at_cancel_y %}
  {% set custom_park = park_x|length > 0 or park_y|length > 0 %}
  ##### end of definitions #####
  # restore idle_timeout time if needed
  {% if printer['gcode_macro RESUME'].restore_idle_timeout > 0 %}
    SET_IDLE_TIMEOUT TIMEOUT={printer['gcode_macro RESUME'].restore_idle_timeout}
  {% endif %}
  {% if (custom_park or not printer.pause_resume.is_paused) and allow_park %} _TOOLHEAD_PARK_PAUSE_CANCEL {park_x} {park_y} RETRACT={retract} {% endif %}
  _CLIENT_RETRACT LENGTH={retract}
  TURN_OFF_HEATERS
  M106 S0
  {client.user_cancel_macro|default("")}
  SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=idle_state VALUE=False
  # clear pause_next_layer and pause_at_layer as preparation for next print
  SET_PAUSE_NEXT_LAYER ENABLE=0
  SET_PAUSE_AT_LAYER ENABLE=0 LAYER=0
  CANCEL_PRINT_BASE

[gcode_macro PAUSE]
description: Pause the actual running print
rename_existing: PAUSE_BASE
gcode:
  ##### get user parameters or use default ##### 
  {% set client = printer['gcode_macro _CLIENT_VARIABLE']|default({}) %}
  {% set idle_timeout = client.idle_timeout|default(0) %}
  {% set temp = printer[printer.toolhead.extruder].target if printer.toolhead.extruder != '' else 0 %}
  {% set restore = False if printer.toolhead.extruder == ''
              else True  if params.RESTORE|default(1)|int == 1 else False %}
  ##### end of definitions #####
  SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=last_extruder_temp VALUE="{{'restore': restore, 'temp': temp}}"
  # set a new idle_timeout value
  {% if idle_timeout > 0 %}
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=restore_idle_timeout VALUE={printer.configfile.settings.idle_timeout.timeout}
    SET_IDLE_TIMEOUT TIMEOUT={idle_timeout}
  {% endif %}
  PAUSE_BASE
  ##### quick-pause ordering (方案B) #####
  ##### _USER_PAUSE only records state in memory, then the retreat is queued. #####
  ##### The disk write (SAVE_VARIABLE, ~20 ms and occasionally much worse on  #####
  ##### eMMC) and the M104 cooldown now run AFTER the park moves are queued,  #####
  ##### so nothing sits between the freeze and the first retreat move.         #####
  {client.user_pause_macro|default("")}
  ##### 2026-11-10 (PM): cool down as early as possible - right at the pause, #####
  ##### before the retreat.  M104 only sets the target and returns at once, so #####
  ##### it costs nothing on the freeze->retreat path (unlike the disk write,     #####
  ##### which has to stay after the park).                                     #####
  _USER_PAUSE_COOLDOWN
  _TOOLHEAD_PARK_PAUSE_CANCEL {rawparams} PARK_RETRACT={client.pause_retract|default(10.0)}
  _USER_PAUSE_SAVE_Z
  ##### manager spec 2026-11-03: drop the bed a fixed amount while parked #####
  ##### reset the accumulator first: a pause that was interrupted by a power #####
  ##### cut leaves it non-zero, and a second pause would then restore too far #####
  ##### (the bed would rise into the nozzle).                               #####
  SAVE_VARIABLE VARIABLE=bed_drop_mm VALUE=0
  ##### the total drop is measured from the frozen Z (power_resume_z), so the   #####
  ##### retreat's own 23 mm lift counts towards it                              #####
  _BED_DROP MM={client.pause_bed_drop_mm|default(50.0)} FROM_Z={printer['gcode_macro RESUME'].power_resume_z}

# Usage: SET_PAUSE_NEXT_LAYER [ENABLE=[0|1]] [MACRO=<name>]
[gcode_macro SET_PAUSE_NEXT_LAYER]
description: Enable a pause if the next layer is reached
gcode:
  {% set pause_next_layer = printer['gcode_macro SET_PRINT_STATS_INFO'].pause_next_layer %}
  {% set ENABLE = params.ENABLE|default(1)|int != 0 %}
  {% set MACRO = params.MACRO|default(pause_next_layer.call, True) %}
  SET_GCODE_VARIABLE MACRO=SET_PRINT_STATS_INFO VARIABLE=pause_next_layer VALUE="{{ 'enable': ENABLE, 'call': MACRO }}"

# Usage: SET_PAUSE_AT_LAYER [ENABLE=[0|1]] [LAYER=<number>] [MACRO=<name>]
[gcode_macro SET_PAUSE_AT_LAYER]
description: Enable/disable a pause if a given layer number is reached
gcode:
  {% set pause_at_layer = printer['gcode_macro SET_PRINT_STATS_INFO'].pause_at_layer %}
  {% set ENABLE = params.ENABLE|int != 0 if params.ENABLE is defined
             else params.LAYER is defined %}
  {% set LAYER = params.LAYER|default(pause_at_layer.layer)|int %}
  {% set MACRO = params.MACRO|default(pause_at_layer.call, True) %}
  SET_GCODE_VARIABLE MACRO=SET_PRINT_STATS_INFO VARIABLE=pause_at_layer VALUE="{{ 'enable': ENABLE, 'layer': LAYER, 'call': MACRO }}"

# Usage: SET_PRINT_STATS_INFO [TOTAL_LAYER=<total_layer_count>] [CURRENT_LAYER= <current_layer>]
[gcode_macro SET_PRINT_STATS_INFO]
rename_existing: SET_PRINT_STATS_INFO_BASE
description: Overwrite, to get pause_next_layer and pause_at_layer feature
variable_pause_next_layer: { 'enable': False, 'call': "PAUSE" }
variable_pause_at_layer  : { 'enable': False, 'layer': 0, 'call': "PAUSE" }
gcode:
  {% if pause_next_layer.enable %}
    RESPOND TYPE=echo MSG='{"%s, forced by pause_next_layer" % pause_next_layer.call}'
    {pause_next_layer.call} ; execute the given gcode to pause, should be either M600 or PAUSE
    SET_PAUSE_NEXT_LAYER ENABLE=0
  {% elif pause_at_layer.enable and params.CURRENT_LAYER is defined and params.CURRENT_LAYER|int == pause_at_layer.layer %}
    RESPOND TYPE=echo MSG='{"%s, forced by pause_at_layer [%d]" % (pause_at_layer.call, pause_at_layer.layer)}'
    {pause_at_layer.call} ; execute the given gcode to pause, should be either M600 or PAUSE
    SET_PAUSE_AT_LAYER ENABLE=0
  {% endif %}
  SET_PRINT_STATS_INFO_BASE {rawparams}
  
##### internal use #####
[gcode_macro _TOOLHEAD_PARK_PAUSE_CANCEL]
description: Helper: park toolhead used in PAUSE and CANCEL_PRINT
gcode:
  ##### get user parameters or use default #####
  {% set client = printer['gcode_macro _CLIENT_VARIABLE']|default({}) %}
  {% set velocity = printer.configfile.settings.pause_resume.recover_velocity %}
  {% set use_custom     = client.use_custom_pos|default(false)|lower == 'true' %}
  {% set custom_park_x  = client.custom_park_x|default(0.0) %}
  {% set custom_park_y  = client.custom_park_y|default(0.0) %}
  {% set park_dz        = client.custom_park_dz|default(2.0)|abs %}
  {% set sp_hop         = client.speed_hop|default(15) * 60 %}
  {% set sp_move        = client.speed_move|default(velocity) * 60 %}
  ##### get config and toolhead values #####
  {% set origin    = printer.gcode_move.homing_origin %}
  {% set act       = printer.gcode_move.gcode_position %}
  {% set max       = printer.toolhead.axis_maximum %}
  {% set cone      = printer.toolhead.cone_start_z|default(max.z) %} ; height as long the toolhead can reach max and min of an delta
  {% set round_bed = True if printer.configfile.settings.printer.kinematics is in ['delta','polar','rotary_delta','winch']
                else False %}
  ##### define park position #####
  {% set z_min = params.Z_MIN|default(0)|float %}
  ##### quick-pause: prefer the [nozzle_cleaner] tray (off the part) as park position #####
  ##### the original custom_park_x/y + park_dz logic is kept as the fallback #####
  {% set nc         = printer.configfile.settings.nozzle_cleaner|default({}) %}
  {% set at_cleaner = client.park_at_cleaner|default(true)|lower == 'true'
                      and nc.get('clean_x_min') is not none
                      and nc.get('clean_x_max') is not none
                      and nc.get('clean_y_max') is not none %}
  {% set nc_x_min   = nc.get('clean_x_min', 250.0)|float %}
  {% set nc_x_max   = nc.get('clean_x_max', 295.0)|float %}
  {% set nc_y_max   = nc.get('clean_y_max', -18.0)|float %}
  ##### factory reference: [nozzle_cleaner] travels at retract_z_height (20) and #####
  ##### scrubs at clean_z_height (2.5, i.e. TOUCHING the wiper).  We park at the #####
  ##### contact height so drips are wicked/scraped away instead of forming a ball #####
  ##### in mid air.  variable_pause_park_z overrides the contact height.        #####
  {% set nc_z_travel = nc.get('retract_z_height', 20.0)|float %}
  {% set nc_z_touch  = nc.get('clean_z_height', 2.5)|float %}
  {% set nc_z_speed  = nc.get('clean_speed', 4000.0)|float %}
  {% set park_z_opt  = client.pause_park_z|default(none) %}
  {% set z_travel = ([[nc_z_travel, z_min]|max, (max.z - origin.z)]|min) if at_cleaner
             else [[(act.z + park_dz), z_min]|max, (max.z - origin.z)]|min %}
  {% set z_park = ([[park_z_opt|float, z_min]|max, (max.z - origin.z)]|min)
             if (at_cleaner and park_z_opt is not none)
             else ([[nc_z_touch, z_min]|max, (max.z - origin.z)]|min) if at_cleaner
             else z_travel %}
  ##### retract used on the pause path (factory clean_retract = 10.0; CANCEL passes its own) #####
  {% set park_retract = params.RETRACT|default(client.pause_retract)|default(client.retract)|float|abs %}
  ##### quick-pause: pause_park_x / pause_park_y put the park and the flick in #####
  ##### a front corner, well away from the model.  None = old bed-edge park.   #####
  {% set x_park_opt = client.get('pause_park_x') %}
  {% set x_park = params.X       if params.X is defined
             else x_park_opt|float if (at_cleaner and x_park_opt is not none)
             else ((nc_x_min + nc_x_max) / 2.0) if at_cleaner
             else custom_park_x  if use_custom
             else 0.0            if round_bed
             else (max.x - 5.0) %}
  ##### quick-pause: park on the BED EDGE, not on the wiper pad.  Sitting on #####
  ##### the pad for a long pause glues the nozzle into the wiper and the pad    #####
  ##### has no room for the ooze; pause_park_y_offset moves the rest position   #####
  ##### that far towards +Y (into the bed, off the pad).  The pad is only       #####
  ##### visited while actually cleaning/priming (those macros move there        #####
  ##### themselves).                                                           #####
  {% set nc_y_rest = nc_y_max + client.pause_park_y_offset|default(0.0)|float %}
  {% set y_park_opt = client.get('pause_park_y') %}
  {% set y_park = params.Y       if params.Y is defined
             else y_park_opt|float if (at_cleaner and y_park_opt is not none)
             else nc_y_rest     if at_cleaner
             else custom_park_y  if use_custom
             else (max.y - 5.0)  if round_bed and z_park < cone
             else 0.0            if round_bed
             else (max.y - 5.0) %}
  ##### quick-pause: clamp the park position to the axis soft limits #####
  ##### (CLEAN_NOZZLE clamps internally; we compute the point ourselves, so clamp here) #####
  {% set ax_x_min = printer.configfile.settings.stepper_x.position_min|float %}
  {% set ax_x_max = printer.configfile.settings.stepper_x.position_max|float %}
  {% set ax_y_min = printer.configfile.settings.stepper_y.position_min|float %}
  {% set ax_y_max = printer.configfile.settings.stepper_y.position_max|float %}
  {% set x_park = [[x_park, ax_x_min]|max, ax_x_max]|min %}
  {% set y_park = [[y_park, ax_y_min]|max, ax_y_max]|min %}
  ##### end of definitions #####
  ##### quick-pause FAST RETREAT (Marlin scheme) #####
  ##### Marlin's gcode_M6001 does it in two combined E+Z moves and then a     #####
  ##### translation:  [E-init_retract, Z+init_lift] -> [E-retract, Z+lift]    #####
  ##### -> XY to the park point.  There is NO dive back down, no cleaning,    #####
  ##### no wipe and no purge line: Z only ever rises while paused, so the     #####
  ##### beam that carries the nozzle can never be driven into the model.      #####
  {% set lift_tot   = client.pause_lift|default(10.0)|float|abs %}
  {% set lift_init  = client.pause_lift_init|default(1.0)|float|abs %}
  {% set sp_move    = client.pause_move_speed|default(70.0)|float|abs %}
  {% set ret_tot    = params.PARK_RETRACT|default(client.pause_retract|default(6.0))|float|abs %}
  {% set ret_init   = client.pause_retract_init|default(2.0)|float|abs %}
  {% set sp_retract = client.pause_retract_speed|default(client.speed_retract|default(60))|float|abs %}
  {% set z_top      = [[act.z + lift_tot, z_min]|max, (max.z - origin.z)]|min %}
  {% set z_first    = [[act.z + lift_init, z_min]|max, z_top]|min %}
  {% set ret_first  = ret_init if ret_tot > ret_init else ret_tot %}
  {% set ret_rest   = ret_tot - ret_first %}
  {% if ret_rest < 0 %}{% set ret_rest = 0 %}{% endif %}
  {% set can_e      = printer.toolhead.extruder != ''
                      and printer[printer.toolhead.extruder].can_extrude %}
  {% set abs_e      = printer.gcode_move.absolute_extrude %}
  ##### remember the KINEMATIC height we really end on (power-loss recovery) #####
  {% set base_z = printer.gcode_move.position.z|float
                  - printer.gcode_move.gcode_position.z|float %}
  SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=park_z VALUE={z_top + base_z}
  {% if "xyz" in printer.toolhead.homed_axes %}
    G90
    {% if can_e %}
      ##### FAST pure-E retract FIRST (shears the thread off) #####
      _CLIENT_EXTRUDE LENGTH=-{ret_tot} SPEED={sp_retract}
      ##### then a FAST horizontal snap toward the park: XY does 300 mm/s while #####
      ##### Z is limited to 7 mm/s, and the slow 2.9 s rise is what draws the    #####
      ##### thread.  This happens at the print height, over printed area.        #####
      {% set snap = client.pause_snap_mm|default(8.0)|float|abs %}
      {% if snap > 0 %}
        ##### 2026-10-28: a lift BEFORE the snap doubled the string length (the #####
        ##### 0.36 s of rising was exactly the time the thread needed to grow), #####
        ##### so the snap happens immediately again.  Heuristic is off unless    #####
        ##### pause_snap_lift > 0 is set explicitly.                             #####
        {% set snap_lift = client.pause_snap_lift|default(0.0)|float|abs %}
        {% if snap_lift > 0 %}
          {% set z_snap = [[act.z + snap_lift, z_first]|max, z_top]|min %}
          G1 Z{z_snap} F{(sp_move * 60)|int}
        {% endif %}
        {% set sdx = x_park - act.x %}
        {% set sdy = y_park - act.y %}
        {% set sdl = (sdx * sdx + sdy * sdy) ** 0.5 %}
        {% if sdl > 0.001 %}
          {% set snap_sp = client.pause_snap_speed|default(300.0)|float|abs %}
          ##### the snap ALSO retracts: the thread is torn and the broken end #####
          ##### pulled back in the same motion, otherwise that end is carried to #####
          ##### wherever the snap lands and starts a new string there.          #####
          ##### the snap direction now comes from the OBJECT polygon (same idea #####
          ##### as PLR's escape): the torn/oozing end must land OFF the part, not #####
          ##### on it.  Falls back to the park direction without a polygon.       #####
          {% set snap_e = client.pause_snap_e|default(4.0)|float|abs %}
          QUICK_PAUSE_SNAP MM={snap} SPEED={snap_sp} RETRACT={snap_e} PX={x_park} PY={y_park}
          {% if abs_e %} M82 {% endif %}
        {% endif %}
      {% endif %}
      ##### then KEEP retracting during the lift: 20 mm at 7 mm/s takes ~2.9 s and #####
      ##### the melt keeps a thread to the nozzle the whole way up, so a single  #####
      ##### retract before the lift cannot prevent the string.                   #####
      {% set lift_ret = client.pause_lift_retract|default(3.0)|float|abs %}
      {% if lift_ret > 0 %}
        M83
        G1 Z{z_first} E-{lift_ret / 3.0} F{(sp_retract * 60)|int}
        G1 Z{z_top} E-{lift_ret * 2.0 / 3.0} F{(sp_retract * 60)|int}
        {% if abs_e %} M82 {% endif %}
      {% else %}
        G1 Z{z_first} F{(sp_move * 60)|int}
        G1 Z{z_top} F{(sp_move * 60)|int}
      {% endif %}
    {% else %}
      G1 Z{z_first} F{(sp_move * 60)|int}
      G1 Z{z_top} F{(sp_move * 60)|int}
    {% endif %}
    G1 X{x_park} Y{y_park} F{(sp_move * 60)|int}
    {% if not printer.gcode_move.absolute_coordinates %} G91 {% endif %}
  {% else %}
    RESPOND TYPE=echo MSG='Printer not homed'
  {% endif %}
  
[gcode_macro _CLIENT_EXTRUDE]
description: Extrudes, if the extruder is hot enough
gcode:
  ##### get user parameters or use default #####
  {% set client = printer['gcode_macro _CLIENT_VARIABLE']|default({}) %}
  {% set use_fw_retract = (client.use_fw_retract|default(false)|lower == 'true') and (printer.firmware_retraction is defined) %}
  {% set length = params.LENGTH|default(client.unretract)|default(1.0)|float %}
  {% set speed = params.SPEED|default(client.speed_unretract)|default(35) %}
  {% set absolute_extrude = printer.gcode_move.absolute_extrude %}
  ##### end of definitions #####
  {% if printer.toolhead.extruder != '' %}
    {% if printer[printer.toolhead.extruder].can_extrude %}
      {% if use_fw_retract %}
        {% if length < 0 %}
          G10
        {% else %}
          G11
        {% endif %}
      {% else %}
        M83
        G1 E{length} F{(speed|float|abs) * 60}
        {% if absolute_extrude %}
          M82
        {% endif %}
      {% endif %}
    {% endif %}
  {% endif %}

[gcode_macro _CLIENT_RETRACT]
description: Retracts, if the extruder is hot enough
gcode:
  {% set client = printer['gcode_macro _CLIENT_VARIABLE']|default({}) %}
  {% set length = params.LENGTH|default(client.retract)|default(1.0)|float %}
  {% set speed = params.SPEED|default(client.speed_retract)|default(35) %}

  _CLIENT_EXTRUDE LENGTH=-{length|float|abs} SPEED={speed|float|abs}

[gcode_macro _CLIENT_LINEAR_MOVE]
description: Linear move with save and restore of the gcode state
gcode:
  {% set x_move = "X" ~ params.X if params.X is defined else "" %}
  {% set y_move = "Y" ~ params.Y if params.Y is defined else "" %}
  {% set z_move = "Z" ~ params.Z if params.Z is defined else "" %}
  {% set e_move = "E" ~ params.E if params.E is defined else "" %}
  {% set rate = "F" ~ params.F if params.F is defined else "" %}
  {% set ABSOLUTE = params.ABSOLUTE | default(0) | int != 0 %}
  {% set ABSOLUTE_E = params.ABSOLUTE_E | default(0) | int != 0 %}
  SAVE_GCODE_STATE NAME=_client_movement
  {% if x_move or y_move or z_move %}
    G9{ 0 if ABSOLUTE else 1 }
  {% endif %}
  {% if e_move %}
    M8{ 2 if ABSOLUTE_E else 3 }
  {% endif %}
  G1 { x_move } { y_move } { z_move } { e_move } { rate }
  RESTORE_GCODE_STATE NAME=_client_movement

[gcode_macro _PAUSE_BOOST]
description: quick-pause: tracks the post-resume over-extrusion window
variable_active: 0
gcode:

[delayed_gcode _PAUSE_BOOST_OFF]
initial_duration: 0
gcode:
    ##### quick-pause: end of the post-resume over-extrusion window #####
    {% if printer['gcode_macro _PAUSE_BOOST'].active|default(0)|int == 1 %}
        M221 S100
        M220 S100
        SET_GCODE_VARIABLE MACRO=_PAUSE_BOOST VARIABLE=active VALUE=0
    {% endif %}

[delayed_gcode _PAUSE_FIRST_OFF]
initial_duration: 0
gcode:
    ##### quick-pause: end of the very-slow (10 %) phase -> the 20 % slow phase #####
    {% set c = printer['gcode_macro _CLIENT_VARIABLE']|default({}) %}
    M220 S{c.pause_boost_slow|default(20.0)|float}
    M221 S{100 + (c.pause_slow_pct|default(150.0)|float)}

[delayed_gcode _PAUSE_SLOW_OFF]
initial_duration: 0
gcode:
    ##### quick-pause: end of the slow phase -> intermediate speed + its factor #####
    {% set c = printer['gcode_macro _CLIENT_VARIABLE']|default({}) %}
    M220 S{c.pause_mid_slow|default(50.0)|float}
    M221 S{100 + (c.pause_mid_pct|default(50.0)|float)}

[delayed_gcode _PAUSE_MID_OFF]
initial_duration: 0
gcode:
    ##### quick-pause: end of the intermediate phase -> normal speed, boost factor #####
    {% set c = printer['gcode_macro _CLIENT_VARIABLE']|default({}) %}
    M220 S100
    M221 S{100 + (c.pause_boost_pct|default(100.0)|float)}
