# Mechanical configuration for PEEK650HT

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 25
square_corner_velocity: 5.0

[stepper_x]
step_pin: motion:PE3
dir_pin: motion:PE2
enable_pin: !motion:PD13
rotation_distance: 20
microsteps: 1
full_steps_per_rotation: 10000
endstop_pin: ^L_tool:PA8
position_endstop: -50
position_min: -60
position_max: 610
homing_speed: 100
homing_retract_speed: 50
second_homing_speed: 5
homing_retract_dist: 20
step_pulse_duration: 0.0000015

[dual_carriage]
axis: x
step_pin: motion:PD9
dir_pin: !motion:PD10
enable_pin: !motion:PD11
rotation_distance: 20
microsteps: 1
full_steps_per_rotation: 10000
endstop_pin: ^R_tool:PA8
position_endstop: 765
position_min: 105
position_max: 765
homing_speed: 100
homing_retract_speed: 50
second_homing_speed: 5
homing_retract_dist: 20
step_pulse_duration: 0.0000015
safe_distance: 155

[stepper_y]
step_pin: motion:PD15
dir_pin: motion:PC7
enable_pin: !motion:PD14
rotation_distance: 20
microsteps: 1
full_steps_per_rotation: 10000
endstop_pin: ^motion:PA2
position_min: 0
position_endstop: 0
position_max: 510
homing_speed: 100
homing_retract_speed: 50
second_homing_speed: 5
homing_retract_dist: 10
step_pulse_duration: 0.0000015
# homing_positive_dir: true

[stepper_z]
step_pin: motion:PC10
dir_pin: motion:PC11
enable_pin: !motion:PA15
rotation_distance: 4
gear_ratio: 3:1
microsteps: 16
full_steps_per_rotation: 200
# endstop_pin: motion:PA3
endstop_pin: probe:z_virtual_endstop
position_max: 710
position_min: -6
homing_speed: 10
second_homing_speed: 1
homing_retract_dist: 5.0
step_pulse_duration: 0.000005
# position_endstop: 0

[stepper_z1]
step_pin: motion:PD1
dir_pin: motion:PD2
enable_pin: !motion:PD0
rotation_distance: 4
gear_ratio: 3:1
microsteps: 16
full_steps_per_rotation: 200

[extruder]
step_pin: L_tool:PC11
dir_pin: !L_tool:PA15
enable_pin: !L_tool:PC10
microsteps: 16
full_steps_per_rotation: 200
rotation_distance:22.9116807962642578993
gear_ratio: 48:19
nozzle_diameter: 0.8
filament_diameter: 1.750
max_extrude_only_distance: 500.0
max_extrude_only_velocity: 60.0
max_extrude_only_accel: 1000.0
max_extrude_cross_section:5
pressure_advance: 0.05
pressure_advance_smooth_time:0.040

[extruder1]
step_pin: R_tool:PC11
dir_pin: !R_tool:PA15
enable_pin: !R_tool:PC10
microsteps: 16
full_steps_per_rotation: 200
rotation_distance:22.9116807962642578993
gear_ratio: 48:19
nozzle_diameter: 0.8
filament_diameter: 1.750
max_extrude_only_distance: 500.0
max_extrude_only_velocity: 60.0
max_extrude_only_accel: 1000.0
max_extrude_cross_section:5
pressure_advance: 0.03
pressure_advance_smooth_time:0.040

[tmc5160 extruder]
cs_pin: L_tool:PC12
spi_software_sclk_pin: L_tool:PB13
spi_software_mosi_pin: L_tool:PB15
spi_software_miso_pin: L_tool:PB14
run_current: 0.8
interpolate: False
sense_resistor: 0.075
stealthchop_threshold: 0

[tmc5160 extruder1]
cs_pin: R_tool:PB5
spi_software_sclk_pin: R_tool:PB13
spi_software_mosi_pin: R_tool:PB15
spi_software_miso_pin: R_tool:PB14
run_current: 0.8
interpolate: False
sense_resistor: 0.075
stealthchop_threshold: 0

[probe]
pin: ^L_tool:PC9
x_offset: 34.6
y_offset: 17.4
# z_offset: 0
speed: 10.0
samples: 1
samples_result: median
sample_retract_dist: 2.0
samples_tolerance: 0.05
samples_tolerance_retries: 3
deactivate_on_each_sample: False
activate_gcode: PROBE_MOTOR_DEPLOY
deactivate_gcode: PROBE_MOTOR_STOW

[nozzle_cleaner]
clean_x_min: -30
clean_x_max: -20
clean_y_min: 225
clean_y_max: 270
clean_z_height: 10
retract_z_height: 0
move_speed: 6000.0
clean_speed: 4000.0
hotend_temp: 180.0

[safe_z_home]
home_xy_position:300,250
speed:150
z_hop:10

[delayed_gcode INIT_STEPPER]
initial_duration:0.01
gcode:
  ENABLE_MOTOR
  M84
  PROBE_MOTOR_STOW

  
