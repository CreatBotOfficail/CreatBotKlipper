# Power loss recovery configuration for D600Pro3

########################################
# power loss recovery
########################################

[gcode_macro _PLR_PARK]
description: PLR: lift the head off the part, home XY and park BEFORE any heating
gcode:
    {% set client = printer['gcode_macro _CLIENT_VARIABLE']|default({}) %}
    {% set prelift = client.plr_prelift|default(10.0)|float|abs %}
    {% set park_x = client.pause_park_x|default(45.0)|float %}
    {% set park_y = client.pause_park_y|default(20.0)|float %}
    {% set sp = (client.speed_move|default(70.0)|float|abs) * 60 %}
    ##### PLR: at power-on the nozzle is still sitting on the part and every  #####
    ##### heater is off.  Moving it away FIRST means                        #####
    #####   (a) heating can no longer drool onto the part, and              #####
    #####   (b) the user can clean the ooze off the part while it is cold.  #####
    ##### The lift is RELATIVE so it needs no knowledge of the real Z; the   #####
    ##### resume file re-declares Z = recorded_z + prelift afterwards.      #####
    SET_KINEMATIC_POSITION Z=0
    G91
    G1 Z{prelift} F{sp}
    G90
    G28 X Y
    G1 X{park_x} Y{park_y} F{sp}
    M400

[gcode_macro _PLR_CONTINUE]
description: PLR: user confirmed the part is clean -> start the generated resume file
gcode:
    {% set sv = printer.save_variables.variables %}
    {% set filepath = params.GCODE_FILE|default(sv.filepath)|string %}
    {% set last_file = filepath.split('/')[-1] %}
    RESPOND TYPE=command MSG="action:prompt_end"
    {% if last_file %}
        SAVE_VARIABLE VARIABLE=was_interrupted VALUE=False
        SDCARD_PRINT_FILE FILENAME=".plr/{last_file}"
    {% else %}
        RESPOND TYPE=error MSG="PLR: no resume file recorded."
    {% endif %}

[gcode_macro _PLR_RESUME_MOVE]
description: PLR: shed the ooze at the park, walk back, descend and prime the nozzle
gcode:
    {% set client = printer['gcode_macro _CLIENT_VARIABLE']|default({}) %}
    ##### the outage left a COLD solidified smear on the nozzle (the heater was #####
    ##### off).  Soak at temperature first so it softens against the block,     #####
    ##### otherwise the wipe just slides over a hard crust.                      #####
    {% set soak_s = client.plr_soak_s|default(20.0)|float|abs %}
    {% if soak_s > 0 %}
        G4 P{(soak_s * 1000)|int}
    {% endif %}
    {% set r = printer['gcode_macro RESUME'] %}
    {% set sv = printer.save_variables.variables %}
    {% set x_r = r.resume_x|default(0.0)|float %}
    {% set y_r = r.resume_y|default(0.0)|float %}
    {% set z_r = r.resume_z|default(0.0)|float %}
    {% set cz = client.pause_close_z|default(0.1)|float|abs %}
    {% set ce = client.pause_close_e|default(0.2)|float|abs %}
    ##### quick-pause: the outage handler retracted the filament while the PSU #####
    ##### capacitors still fed the steppers (POWER_LOSS_RETRACT), so the melt   #####
    ##### sits plr_loss_done mm further back than before the outage.  Push that  #####
    ##### amount back on top of the normal prime, otherwise the first lines are  #####
    ##### starved again.  plr_loss_done is written by the retract itself (0 when  #####
    ##### the print was already paused and the retract was skipped).             #####
    {% set loss_ret = sv.plr_loss_done|default(0.0)|float|abs %}
    {% set prime_e = client.plr_prime_e|default(6.0)|float|abs %}
    {% set refill_speed = client.plr_refill_speed|default(4.0)|float|abs %}
    {% set prime_speed = client.plr_prime_speed|default(2.0)|float|abs %}
    {% set sp_move = client.pause_move_speed|default(70.0)|float|abs %}
    {% set sp_close = client.pause_close_speed|default(1.0)|float|abs %}
    {% set sp_retract = client.pause_retract_speed|default(10.0)|float|abs %}
    {% set trav_ret = client.pause_travel_retract|default(4.0)|float|abs %}
    {% set whip_x = client.pause_whip_x|default(25.0)|float %}
    {% set whip_n = client.plr_wipe_passes|default(10)|int %}
    {% set whip_sp = client.pause_whip_speed|default(800.0)|float %}
    {% set whip_accel = client.pause_whip_accel|default(8000.0)|float %}
    {% set suck = client.plr_wipe_suck_e|default(6.0)|float %}
    ##### 2026-10-30: the outage leaves a COLD HARD SMEAR on the outside of the #####
    ##### nozzle; the whip slides over it.  Spit hot material slowly so it     #####
    ##### floods the tip face and fuses with the smear, then WAIT (no motion)  #####
    ##### so the heat soaks in - it becomes one soft bead the whip can take.   #####
    ##### The spit is subtracted from the refill, so the total is unchanged.   #####
    {% set spit_e = client.plr_flick_spit_e|default(4.0)|float|abs %}
    ##### 2026-10-30: the refill must also cover what the resume path pulls back #####
    ##### after it (whip suck + travel retract) and may subtract what the point  #####
    ##### pushes (prime + close), exactly like the pause path's flush.  Without  #####
    ##### them the chamber was 8.8 mm short when the first line started.        #####
    {% set refill_total = loss_ret + suck + trav_ret - prime_e - ce %}
    {% set spit_sp = client.plr_flick_spit_speed|default(3.0)|float|abs %}
    {% set spit_dwell = client.plr_flick_dwell_s|default(2.0)|float|abs %}
    {% set per_pass = (suck / whip_n) if whip_n > 0 else 0.0 %}
    {% set can_e = printer.toolhead.extruder != ''
                   and printer[printer.toolhead.extruder].can_extrude %}
    {% set abs_e = printer.gcode_move.absolute_extrude %}
    G90
    {% if can_e and refill_total > 0 %}
        ##### 0) push back what the outage retract pulled out (minus the spit, #####
        ##### which is delivered right after, wetter and slower).  Done at the #####
        ##### corner, BEFORE the whip.                                        #####
        {% set refill_net = refill_total - spit_e %}
        {% if refill_net > 0 %}
            _CLIENT_EXTRUDE LENGTH={refill_net} SPEED={refill_speed}
        {% endif %}
    {% endif %}
    {% if can_e and spit_e > 0 %}
        ##### 0b) wet spit + dwell, so the smear fuses into one soft bead #####
        _CLIENT_EXTRUDE LENGTH={spit_e} SPEED={spit_sp}
        {% if spit_dwell > 0 %}
            G4 P{(spit_dwell * 1000)|int}
        {% endif %}
    {% endif %}
    {% if can_e %}
        ##### 1) flick the bead off the tip while pulling the thread back #####
        M83
        {% set v_old = printer.toolhead.max_velocity|float %}
        {% set a_old = printer.toolhead.max_accel|float %}
        {% set x_here = printer.gcode_move.gcode_position.x|float %}
        {% set y_here = printer.gcode_move.gcode_position.y|float %}
        SET_VELOCITY_LIMIT VELOCITY={whip_sp} ACCEL={whip_accel}
        {% for i in range(whip_n) %}
            G1 X{x_here - whip_x if i % 2 == 0 else x_here + whip_x} Y{y_here} E-{per_pass} F{(whip_sp * 60)|int}
        {% endfor %}
        G1 X{x_here} F{(whip_sp * 60)|int}
        SET_VELOCITY_LIMIT VELOCITY={v_old} ACCEL={a_old}
        ##### 1b) seal the chamber before the travel (same as RESUME does).   #####
        ##### Without it the melt carried the ~9 mm over-pressure to the part #####
        ##### and that is what piled up on the resume point.                   #####
        {% if trav_ret > 0 %}
            _CLIENT_EXTRUDE LENGTH=-{trav_ret} SPEED={sp_retract}
        {% endif %}
        {% if abs_e %} M82 {% endif %}
    {% endif %}
    ##### 2) walk back to the frozen point, still prelift mm above it #####
    G1 X{x_r} Y{y_r} F{(sp_move * 60)|int}
    ##### 3) descend fast to 1 mm above the print, then slowly into it #####
    G1 Z{z_r + 1.0} F{(sp_move * 60)|int}
    G1 Z{z_r + cz} F{(sp_move * 60)|int}
    G1 Z{z_r} F{(sp_close * 60)|int}
    ##### 4) tiny point prime: only break the meniscus.  A big stationary #####
    ##### prime here is exactly what left a blob on the resume point.     #####
    {% if can_e and prime_e > 0 %}
        _CLIENT_EXTRUDE LENGTH={prime_e} SPEED={prime_speed}
        _CLIENT_EXTRUDE LENGTH={ce} SPEED={sp_close}
    {% endif %}

[gcode_macro _PLR_RAMP]
description: PLR: same slow -> mid -> full make-up ramp that RESUME uses
gcode:
    {% set c = printer['gcode_macro _CLIENT_VARIABLE']|default({}) %}
    {% set slow = c.pause_boost_slow|default(20.0)|float %}
    ##### 2026-10-28: the PLR slow stage has its own duration.  Sharing #####
    ##### pause_slow_s made the PLR tail accumulate ("淤积") while the    #####
    ##### pause-resume path was fine, so PLR is now 1 s shorter.          #####
    {% set slow_s = c.plr_slow_s|default(8.0)|float|abs %}
    {% set slow_pct = c.plr_slow_pct|default(150.0)|float %}
    {% set mid = c.pause_mid_slow|default(50.0)|float %}
    {% set mid_s = c.pause_mid_s|default(3.0)|float|abs %}
    {% set bpct = c.pause_boost_pct|default(0.0)|float %}
    {% set bsec = c.pause_boost_s|default(3.0)|float|abs %}
    {% if slow_pct != 0 %}
        M221 S{100 + slow_pct}
    {% elif bpct != 0 %}
        M221 S{100 + bpct}
    {% endif %}
    ##### stage 0: very slow 10 % first (same idea as the pause path) #####
    {% set first_s = c.plr_first_s|default(4.0)|float|abs %}
    {% set first_slow = c.plr_first_slow|default(10.0)|float %}
    {% set lead = 0.0 %}
    {% if first_s > 0 and first_slow > 0 and first_slow < 100 %}
        M220 S{first_slow}
        UPDATE_DELAYED_GCODE ID=_PAUSE_FIRST_OFF DURATION={first_s}
        {% set lead = first_s %}
    {% endif %}
    {% if slow_s > 0 and slow > 0 and slow < 100 %}
        M220 S{first_slow if lead > 0 else slow}
        UPDATE_DELAYED_GCODE ID=_PAUSE_SLOW_OFF DURATION={lead + slow_s}
    {% endif %}
    {% if mid_s > 0 and mid > 0 and mid < 100 %}
        UPDATE_DELAYED_GCODE ID=_PAUSE_MID_OFF DURATION={lead + slow_s + mid_s}
    {% endif %}
    ##### always arm the final reset: slow/mid are handled by the delayed    #####
    ##### gcodes above, the final M220/M221 100 comes from _PAUSE_BOOST_OFF  #####
    SET_GCODE_VARIABLE MACRO=_PAUSE_BOOST VARIABLE=active VALUE=1
    UPDATE_DELAYED_GCODE ID=_PAUSE_BOOST_OFF DURATION={lead + slow_s + mid_s + bsec}

[gcode_macro _RESUME_INTERRUPTED]
gcode:
    {% set sv = printer.save_variables.variables %}
    {% set client = printer['gcode_macro _CLIENT_VARIABLE']|default({}) %}
    {% set park_dz = client.custom_park_dz|default(2.0)|abs %}
    {% set prelift = client.plr_prelift|default(10.0)|float|abs %}
    {% set outage_hop = client.plr_hop|default(0.5)|float|abs %}
    RESPOND TYPE=command MSG="action:prompt_end"
    SET_GCODE_OFFSET Z=0 MOVE=0
    {% set is_paused = sv.power_loss_paused|default(False) %}
    {% set filepath = params.GCODE_FILE|default(sv.filepath)|string %}
    {% set last_file = filepath.split('/')[-1] %}
    {% set hotend = sv.power_resume_extruder|default("extruder")%}
    {% set z_offset = sv.nozzle_z_offset_val|default(0)|float %}
    {% set z_offset_total = park_dz if is_paused else 0 %}
    {% if hotend == "extruder1" %}
        {% set z_offset_total = z_offset_total +  z_offset %}
    {% endif %}
    ##### 2026-11-11: which PLR implementation to use.  Default = the ORIGINAL #####
    ##### vendor flow; set plr_quick_pause: True for the quick-pause version     #####
    ##### (park + heat + purge prompt + make-up chain).                          #####
    {% set quick_plr = client.plr_quick_pause|default(false)|lower == 'true' %}
    SET_STEPPER_ENABLE STEPPER=stepper_z ENABLE=1
    G4 P300
    M118 Recovery in progress, please wait
    {% if not quick_plr %}
        ##### ORIGINAL vendor flow #####
        RUN_SHELL_COMMAND CMD=_POWER_LOSS_RECOVERY_ORIG PARAMS="{z_offset_total}"
        {% if last_file %}
            SAVE_VARIABLE VARIABLE=was_interrupted VALUE=False
            SDCARD_PRINT_FILE FILENAME=".plr/{last_file}"
        {% else %}
            RESPOND TYPE=error MSG="PLR: no resume file recorded."
        {% endif %}
    {% else %}
    ##### 1) generate the resume file (plr.sh) while nothing is moving #####
    RUN_SHELL_COMMAND CMD=_POWER_LOSS_RECOVERY PARAMS="{z_offset_total} {prelift} {outage_hop}"
    ##### 2) park BEFORE heating, so the heat-up cannot drool onto the part #####
    _PLR_PARK
    ##### 3) heat FIRST, then prompt.  A prompt shown while the nozzle is still #####
    ##### cold queues every button press behind a blocking M109: the UI looks    #####
    ##### dead, the user presses Cancel and the resume dies exactly when the     #####
    ##### temperature arrives (reported 2026-10-30).                          #####
    {% if printer.toolhead.extruder != '' %}
        {% set _r = printer['gcode_macro RESUME'] %}
        {% set _stored = _r.last_extruder_temp.temp|default(0)|float
                         if printer.toolhead.extruder == 'extruder'
                         else _r.last_extruder1_temp.temp|default(0)|float %}
        {% set _target = _stored if _stored > 100 else client.plr_purge_temp|default(245.0)|float %}
        {% set _side = "Left" if printer.toolhead.extruder == 'extruder' else "Right" %}
        RESPOND TYPE=echo MSG='{"Restoring %s extruder temperature to %.0f C, this may take some time. (正在恢复%s喷头温度至 %.0f 度，请稍候)" % (_side, _target, _side, _target)}'
        M109 S{_target}
    {% endif %}
    ##### 4) now the buttons respond immediately: let the user clean the part #####
    #####    AND verify the nozzle is not blocked                            #####
    _PLR_CLEAN_PROMPT
    {% endif %}

[gcode_macro _PLR_CLEAN_PROMPT]
description: PLR: ask the user to clean the part and unblock the nozzle
gcode:
    RESPOND TYPE=command MSG="action:prompt_begin Power loss recovery"
    RESPOND TYPE=command MSG="action:prompt_text Print head parked away from the part. Clean the oozed filament off the part and make sure the nozzle is NOT blocked: press Purge 10 mm until filament comes out straight and clean, then press Continue. (喷头已停靠移开。请清理打印件上的渗料，并检查喷嘴是否被糊住：反复点「挤出 10mm」直到出料顺畅、不偏斜，再点继续)"
    RESPOND TYPE=command MSG="action:prompt_footer_button Purge 10 mm|_PLR_PURGE|secondary"
    RESPOND TYPE=command MSG="action:prompt_footer_button Continue|_PLR_CONTINUE"
    RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_ABORT_INTERRUPTED|error"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _PLR_PURGE]
description: PLR: heat the nozzle (it is still cold here) and extrude a fixed amount
gcode:
    {% set client = printer['gcode_macro _CLIENT_VARIABLE']|default({}) %}
    {% set r = printer['gcode_macro RESUME'] %}
    {% set e = client.plr_purge_e|default(10.0)|float|abs %}
    {% set sp = client.plr_purge_speed|default(3.0)|float|abs %}
    ##### LOCK the prompt first: a 10 mm purge at 3 mm/s takes ~3.3 s and the    #####
    ##### user cannot see progress, so repeated presses piled up in the queue.  #####
    ##### With no buttons on screen nothing can be pressed until we are done.   #####
    RESPOND TYPE=command MSG="action:prompt_begin Purging / 正在挤出"
    RESPOND TYPE=command MSG='{"action:prompt_text Extruding %.0f mm, please wait... (正在挤出 %.0f mm，请稍候…)" % (e, e)}'
    RESPOND TYPE=command MSG="action:prompt_show"
    {% if printer.toolhead.extruder != '' %}
        {% set stored = r.last_extruder_temp.temp|default(0)|float
                        if printer.toolhead.extruder == 'extruder'
                        else r.last_extruder1_temp.temp|default(0)|float %}
        {% set target = stored if stored > 100 else client.plr_purge_temp|default(245.0)|float %}
        M109 S{target}
        _CLIENT_EXTRUDE LENGTH={e} SPEED={sp}
    {% endif %}
    ##### wait until it has actually been executed, then give the buttons back #####
    M400
    G4 P200
    _PLR_CLEAN_PROMPT

[delayed_gcode _CHECK_POWER_LOSS_RECOVERY]
initial_duration: 1
gcode:
    {% set was_interrupted = printer.save_variables.variables.was_interrupted | default(False) | string %}
    {% set enable_recovery = printer.save_variables.variables.power_loss_recovery | default(Ture) | string %}
    {% if enable_recovery != "False" and was_interrupted == "True" %}
        RESPOND TYPE=command MSG="action:prompt_begin "
        RESPOND TYPE=command MSG="action:prompt_text The last print job was not completed continue printing?"
        RESPOND TYPE=command MSG="action:prompt_footer_button Continue|_RESUME_INTERRUPTED"
        RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_ABORT_INTERRUPTED|error"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% endif %}

[gcode_shell_command _CLEAR_PLR]
command: sh /opt/klipper/scripts/clear_plr.sh
timeout: 5.
verbose: False

[gcode_macro _CLEAR_LAST_FILE]
gcode:
    {% set filename = '' %}
    {% set filepath = '' %}
    RUN_SHELL_COMMAND CMD=_CLEAR_PLR
    SAVE_VARIABLE VARIABLE=last_file VALUE='"{ filename }"'
    SAVE_VARIABLE VARIABLE=filepath VALUE='"{ filepath }"'
    {% set zero_vars = ['power_resume_position', 'power_resume_line'] %}
    {% for var in zero_vars %}
        SAVE_VARIABLE VARIABLE={var} VALUE=0
    {% endfor %}
    SAVE_VARIABLE VARIABLE=was_interrupted VALUE=False

[gcode_shell_command _POWER_LOSS_RECOVERY_ORIG]
command: /opt/klipper/scripts/plr_orig.sh
timeout: 420.
verbose: False

[gcode_shell_command _POWER_LOSS_RECOVERY]
command: /opt/klipper/scripts/plr.sh
timeout: 420.
verbose: False

[gcode_macro _ABORT_INTERRUPTED]
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    _CLEAR_LAST_FILE
