# Temperature configuration for PEEK650HT

[extruder]
sensor_type: PT1000
sensor_pin: L_tool:PA0
pullup_resistor: 4700
heater_pin: L_tool:PC1
max_power: 1.0
min_temp: -20
max_temp: 800
overshoot: 20
min_extrude_temp: 100
# control = pid
# pid_kp = 23.904
# pid_ki = 1.476
# pid_kd = 96.810

[verify_heater extruder]
max_error: 20
check_gain_time: 60
hysteresis: 10
heating_gain: 1

[extruder1]
sensor_type: PT1000
sensor_pin: R_tool:PA0
pullup_resistor: 4700
heater_pin: R_tool:PC1
max_power: 1.0
min_temp: -20
max_temp: 520
overshoot: 20
min_extrude_temp: 100
# control = pid
# pid_kp = 23.904
# pid_ki = 1.476
# pid_kd = 96.810

[verify_heater extruder1]
max_error: 20
check_gain_time: 60
hysteresis: 10
heating_gain: 1

[multi_pin bed]
pins: AC:PB11, AC:PB14

[heater_bed]
heater_pin: multi_pin:bed
sensor_type: PT1000
pullup_resistor: 4700
sensor_pin: motion:PC0
max_power: 1.0
min_temp: -20
max_temp: 300
overshoot: 10
# pwm_cycle_time: 0.3
#control = pid
#pid_kp = 52.123
#pid_ki = 0.922
#pid_kd = 736.891

[verify_heater heater_bed]
max_error: 20
hysteresis: 20
check_gain_time: 120
heating_gain: 1

[multi_pin chamber]
pins: AC:PB8, AC:PB6

[heater_chamber]
heater_pin: multi_pin:chamber
max_power: 1.0
sensor_type: PT1000
pullup_resistor: 4700
sensor_pin: motion:PC1
min_temp: -20
max_temp: 300
overshoot: 10
# control: pid
# pid_kp: 30.68
# pid_ki: 0.21
# pid_kd: 0

[verify_heater heater_chamber]
max_error: 120
hysteresis: 100
check_gain_time: 3600
heating_gain: 0.01


[heater_generic thermal_radiation]
heater_pin:AC:PC6
max_power:1.0
sensor_type: PT1000
pullup_resistor: 4700
sensor_pin:L_tool:PA1
min_temp: -20
max_temp: 300
overshoot: 10
#pwm_cycle_time: 0.3
control: pid
pid_kp: 30.68
pid_ki: 0.21
pid_kd: 0

