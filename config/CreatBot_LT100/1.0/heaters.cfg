# Heaters Configuration for LT100

[multi_pin heater]
pins: tool:PC0, tool:PC2

[extruder]
sensor_type: PT1000
pullup_resistor: 4700
sensor_pin: tool:PA0
heater_pin: multi_pin:heater
max_power: 1.0
min_temp: -20
max_temp: 420
overshoot: 20
min_extrude_temp: 100
pressure_advance: 0.03
pressure_advance_smooth_time:0.040
# control = pid
# pid_kp = 23.904
# pid_ki = 1.476
# pid_kd = 96.810

[verify_heater extruder]
max_error: 20
check_gain_time: 60
hysteresis: 10
heating_gain: 1

[heater_bed]
heater_pin: motion:PB1
sensor_type: Generic 3950
pullup_resistor: 47000
sensor_pin: motion:PC0
max_power: 1.0
min_temp: -20
max_temp: 100
overshoot: 10
# control = pid
# pid_kp = 52.123
# pid_ki = 0.922
# pid_kd = 736.891

[verify_heater heater_bed]
max_error: 20
hysteresis: 5
check_gain_time: 120
heating_gain: 1

