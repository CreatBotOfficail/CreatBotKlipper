# Mechanical config for LT100

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 5000
max_z_velocity: 7
max_z_accel: 100
square_corner_velocity: 3

[extruder]
step_pin: tool:PC11
dir_pin: !tool:PA15
enable_pin: !tool:PC10
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 8.727769
gear_ratio: 1:1
nozzle_diameter: 2.0
filament_diameter: 2.85
max_extrude_only_distance: 5000.0
max_extrude_only_velocity: 60.0
max_extrude_only_accel: 10000.0
max_extrude_cross_section:15

[tmc5160 extruder]
cs_pin: tool:PC12
spi_software_sclk_pin: tool:PB13
spi_software_mosi_pin: tool:PB15
spi_software_miso_pin: tool:PB14
run_current: 1.2
interpolate: False
sense_resistor: 0.075
stealthchop_threshold: 0

[stepper_x]
step_pin: motion:PE3
dir_pin: motion:PE2
enable_pin: !motion:PD13
rotation_distance: 95
microsteps: 100
full_steps_per_rotation: 200
# gear_ratio: 2.5:1
endstop_pin: tool:PA8
position_min: 0
position_endstop: 0
position_max: 1100
homing_speed: 100
homing_retract_speed: 50
second_homing_speed: 5
homing_retract_dist: 10
# homing_positive_dir: true

[stepper_y]
step_pin: motion:PD15
dir_pin: !motion:PC7
enable_pin: !motion:PD14
rotation_distance: 30
microsteps: 40
full_steps_per_rotation: 200
gear_ratio: 1:1
endstop_pin: motion:PA2
position_endstop: 0
position_max: 1050
position_min: 0
homing_speed: 100
homing_retract_speed: 50
second_homing_speed: 5
homing_retract_dist: 10
# homing_positive_dir: true

[stepper_z]
step_pin: motion:PC10
dir_pin: !motion:PC11
enable_pin: !motion:PA15
rotation_distance: 5
gear_ratio: 3:1
microsteps: 16
full_steps_per_rotation: 200
endstop_pin: probe:z_virtual_endstop
position_max: 1100
position_min: -40
homing_speed: 10
second_homing_speed: 1
homing_retract_dist: 2.0
step_pulse_duration: 0.000005
# position_endstop: 0

[tmc5160 stepper_z]
cs_pin: motion:PC12
spi_software_sclk_pin: motion:PB3
spi_software_mosi_pin: motion:PB5
spi_software_miso_pin: motion:PB4
run_current: 1.5
interpolate: True
sense_resistor: 0.075

[stepper_z1]
step_pin: motion:PD1
dir_pin: !motion:PD2
enable_pin: !motion:PD0
rotation_distance: 5
gear_ratio: 3:1
microsteps: 16
full_steps_per_rotation: 200
[tmc5160 stepper_z1]
cs_pin: motion:PD3
spi_software_sclk_pin: motion:PB3
spi_software_mosi_pin: motion:PB5
spi_software_miso_pin: motion:PB4
run_current: 1.5
interpolate: True
sense_resistor: 0.075

[stepper_z2]
step_pin: motion:PD5
dir_pin: !motion:PD7
enable_pin: !motion:PD4
rotation_distance: 5
gear_ratio: 3:1
microsteps: 16
full_steps_per_rotation: 200

[tmc5160 stepper_z2]
cs_pin: motion:PD6
spi_software_sclk_pin: motion:PB3
spi_software_mosi_pin: motion:PB5
spi_software_miso_pin: motion:PB4
run_current: 1.5
interpolate: True
sense_resistor: 0.075

[stepper_z3]
step_pin: motion:PE1
dir_pin: !motion:PA14
enable_pin: !motion:PE0
rotation_distance: 5
gear_ratio: 3:1
microsteps: 16
full_steps_per_rotation: 200

[tmc5160 stepper_z3]
cs_pin: motion:PA13
spi_software_sclk_pin: motion:PB3
spi_software_mosi_pin: motion:PB5
spi_software_miso_pin: motion:PB4
run_current: 1.5
interpolate: True
sense_resistor: 0.075

[probe]
pin: !tool:PB4
x_offset: 7.34
y_offset: 36.16
#z_offset: 4
speed: 5.0
samples: 3
samples_result: median
sample_retract_dist: 2.0
samples_tolerance: 0.05
samples_tolerance_retries: 3
deactivate_on_each_sample: False
activate_gcode: PROBE_SERVO_OPEN
deactivate_gcode: PROBE_SERVO_CLOSE

[servo probe_servo]
pin: tool:PB11
maximum_servo_angle: 180
minimum_pulse_width: 0.000900
maximum_pulse_width: 0.002100
initial_angle: 130
steps_decomposed: 60
signal_duration: 0.1

[safe_z_home]
home_xy_position:500,500
speed:600
z_hop:30

[quad_gantry_level]
gantry_corners:
    -210,-63.7
    1355,1126.3
points:
    42.66, 13.84
    42.66, 963.84
    1042.66, 963.84
    1042.66, 13.84
speed: 500
horizontal_move_z: 45
max_adjust: 15
retries: 3
retry_tolerance: 0.1
