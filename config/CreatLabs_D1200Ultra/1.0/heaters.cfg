# Heaters configuration for D1200Ultra

[extruder]
sensor_type: PT1000
sensor_pin: L_tool:PA0
pullup_resistor: 4700
heater_pin: L_tool:PC1
max_power: 1.0
min_temp: -20
max_temp: 420
overshoot: 20
min_extrude_temp: 100
# control = pid
# pid_kp = 23.904
# pid_ki = 1.476
# pid_kd = 96.810

[verify_heater extruder]
max_error: 20
check_gain_time: 60
hysteresis: 10
heating_gain: 1

[extruder1]
sensor_type: PT1000
sensor_pin: R_tool:PA0
pullup_resistor: 4700
heater_pin: R_tool:PC1
max_power: 1.0
min_temp: -20
max_temp: 420
overshoot: 20
min_extrude_temp: 100
# control = pid
# pid_kp = 23.904
# pid_ki = 1.476
# pid_kd = 96.810

[verify_heater extruder1]
max_error: 20
check_gain_time: 60
hysteresis: 10
heating_gain: 1

[multi_pin bed_heat]
pins: AC:PB11, AC:PB14, AC:PA8

[heater_bed]
heater_pin: multi_pin:bed_heat
sensor_type: Generic 3950
pullup_resistor: 47000
sensor_pin: motion:PC0
max_power: 1.0
min_temp: -20
max_temp: 150
overshoot: 10
#control = pid
#pid_kp = 17.22
#pid_ki = 0.9
#pid_kd = 218.61

[verify_heater heater_bed]
max_error: 20
hysteresis: 5
check_gain_time: 120
heating_gain: 1

[multi_pin chamber_pin]
pins: AC:PB8, AC:PB6, AC:PB4

[heater_generic chamber]
heater_pin: multi_pin:chamber_pin
max_power:1.0
sensor_type: Generic 3950
pullup_resistor: 47000
sensor_pin: motion:PC1
min_temp: -20
max_temp: 90
overshoot: 10
pwm_cycle_time: 0.3
# control: pid
# pid_kp: 30.68
# pid_ki: 0.21
# pid_kd: 0

[verify_heater chamber]
max_error: 120
hysteresis: 100
check_gain_time: 3600
heating_gain: 0.01

[multi_pin filament_pin]
pins: AC:PD4, AC:PD2

[heater_filament_chamber]
heater_pin: multi_pin:filament_pin
max_power:1.0
sensor_type: Generic 3950
pullup_resistor: 47000
sensor_pin: motion:PC2
min_temp: -20
max_temp: 70
overshoot: 10
pwm_cycle_time: 0.3
control: watermark
max_delta: 2.0

[verify_heater heater_filament_chamber]
max_error: 120
hysteresis: 100
check_gain_time: 3600
heating_gain: 0.01
